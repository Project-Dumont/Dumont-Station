    sprite: _Dumont/BloodCult/Clothing/cult_leader_form.rsi
    state: icon
  - type: Clothing
    sprite: _Dumont/BloodCult/Clothing/cult_leader_form.rsi
  - type: Unremoveable
  - type: CultItem
  - type: HideLayerClothing
    slots:
    - Tail
    - Wings
    - Hair
    - FacialHair
    - Face
    - Chest
    - Underwear
    - Undershirt
    - Groin
    - Head
    - Snout
    - HeadSide
    - HeadTop
    - Eyes
    - RArm
    - LArm
    - RHand
    - LHand
    - RLeg
    - LLeg
    - RFoot
    - LFoot
    clothingSlots:
    - head
    - eyes
    - ears
    - mask
    - jumpsuit
    - neck
    - back
    - belt
    - gloves
    - shoes
    - id
    - pocket1
    - pocket2
    - suitstorage
  - type: Armor
    modifiers:
      coefficients: # 50% resist
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.5
        Cold: 0.5
        Shock: 0.5
        Caustic: 0.5
        Poison: 0.5
        Radiation: 0.5
  - type: ClothingSpeedModifier
    walkModifier: 1.2
    sprintModifier: 1.2

