- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterBloodCultLeaderForm
  name: Nar'Sien husk
  description: The shape Nar'Sie wears Her chosen in. It does not come off.
  categories: [ HideSpawnMenu ]
  components:
