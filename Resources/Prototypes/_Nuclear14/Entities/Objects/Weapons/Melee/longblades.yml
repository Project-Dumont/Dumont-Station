- type: entity
  name: machete
  parent: [ Machete, BaseSalvageContraband ]
  id: N14Machete
  description: A large, vicious looking blade.
  components:
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 28
        Piercing: 10
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Clothing
    sprite: _Nuclear14/Objects/Weapons/Melee/machete.rsi
    quickEquip: false
    slots:
    - Belt
    - suitStorage
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Melee/machete.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: _Nuclear14/Objects/Weapons/Melee/machete.rsi
  - type: StaticPrice
    price: 30

- type: entity
  name: scrap machete
  parent: N14Machete
  id: N14ScrapMachete
  components:
  - type: Clothing
    sprite: _Nuclear14/Objects/Weapons/Melee/scrap_machete.rsi
    quickEquip: false
    slots:
    - Belt
    - suitStorage
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Melee/scrap_machete.rsi
    state: icon
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 16
        Piercing: 5
  - type: MeleeWeapon
    damage:
      types:
        Slash: 16
        Piercing: 4
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    sprite: _Nuclear14/Objects/Weapons/Melee/scrap_machete.rsi
  - type: StaticPrice
    price: 15

- type: entity
  name: ripper
  parent: N14Machete
  id: N14ripper
  components:
  - type: Clothing
    sprite: _Nuclear14/Objects/Weapons/Melee/ripper.rsi
    quickEquip: false
    slots:
    - Belt
    - suitStorage
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Melee/ripper.rsi
    state: icon
  - type: EmbeddableProjectile
    sound: /Audio/_Nuclear14/Weapons/Melee/Swing/ripper.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 20
        Piercing: 9
  - type: Sharp
  - type: MeleeWeapon
    autoAttack: true
    angle: 0
    wideAnimationRotation: -135
    attackRate: 2.5
    damage:
      types:
        Slash: 11
        Piercing: 3
        Structural: 8
    soundHit:
      path: /Audio/_Nuclear14/Weapons/Melee/Swing/ripper.ogg
  - type: Item
    size: Large
    sprite: _Nuclear14/Objects/Weapons/Melee/ripper.rsi
  - type: DisarmMalus
  - type: RefillableSolution
    solution: Welder
  - type: SolutionContainerManager
    solutions:
      Welder:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 300
        maxVol: 300
  - type: UseDelay
    delay: 1
  - type: Tool
    qualities:
      - Sawing
    speedModifier: 3.0
  - type: StaticPrice
    price: 50
  - type: SurgeryTool
    startSound:
      path: /Audio/Medical/Surgery/saw.ogg
  - type: BoneSaw
    speed: 0.75
  - type: Scalpel
    speed: 0.5
