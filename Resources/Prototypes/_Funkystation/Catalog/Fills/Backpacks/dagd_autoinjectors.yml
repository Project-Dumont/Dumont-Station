- type: entity
  parent: ClothingBackpackDuffelSyndicateMedicalBundle
  id: ClothingBackpackDuffelSyndicateCartridgeAutoinjectorBundleFilled
  name: autoinjector bundle
  description: "A bag containing 4 Syndicate branded cartridge autoinjectors as well as hard and soft cases, both filled with various cartridges, and a few extras for treating gunshot wounds. For healing in a pinch when you don't have time to stop!"
  components:
  - type: Storage
    grid:
    - 0,0,7,5
  - type: StorageFill
    contents:
      - id: SyndicateHypo
        amount: 4
      - id: autoInjectorCartridgeCaseFilled
        amount: 2
      - id: autoInjectorCartridgeCaseSoftFilled
        amount: 4
      - id: CartridgeGunshotSyndicate
        amount: 4
