- type: entity
  parent: FoodBase
  id: AmmoniaCrystal
  name: ammonia crystal
  description: A crystal made from ammonia gas. You can see the liquid gases inside.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Weapons/Grenades/ammoniacrystal.rsi
    state: icon
  - type: FlavorProfile
    flavors:
    - eggplant
  - type: StaticPrice
    price: 200 #Dumont
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Ammonia
          Quantity: 6

- type: entity
  parent: BaseItem #Dumont
  id: HealiumCrystal
  name: healium crystal
  description: A crystal made from healium gas. It's cold to the touch and looks strangely sweet and appetizing.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Weapons/Grenades/healiumcrystal.rsi
    #Dumont start
    state: icon
  - type: FlavorProfile
    flavors:
      - cold
  - type: Food
    solution: food
    delay: 5
    forceFeedDelay: 5
    transferAmount: 50
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 50
        reagents:
        - ReagentId: Healium
          Quantity: 40
        - ReagentId: Nitrium
          Quantity: 10
  - type: StaticPrice
    price: 1000
    #Dumont end
    
- type: entity
  parent: GrenadeBase
  id: ProtoNitrateCrystal
  name: proto-nitrate crystal
  description: A crystal made from proto-nitrate gas. You can see the liquid gases inside.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Weapons/Grenades/protonitratecrystal.rsi
  - type: ReleaseGasOnTrigger # Dumont edit start
    removeFraction: 0.25
    air:
      volume: 1000
      moles:
      - 436.8 # oxygen
      - 1643.2 # nitrogen
      temperature: 293.15
  - type: SmokeOnTrigger
    duration: 8
    spreadAmount: 20
    smokePrototype: Resin
    keysIn:
    - timer #Dumont end
  - type: EmitSoundOnTrigger 
    sound:
      path: /Audio/Effects/spray.ogg
    keysIn:
    - timer
    positional: true
  - type: DeleteOnTrigger
    keysIn:
    - timer
  - type: Appearance
  - type: StaticPrice
    price: 650
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/Items/smoke_grenade_smoke.ogg

- type: entity
  parent: GrenadeBase
  id: NitrousOxideCrystal
  name: nitrous oxide crystal
  description: A crystal made from nitrous oxide gas. You can see the liquid gases inside.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Weapons/Grenades/nitrousoxidecrystal.rsi
  - type: AdjustAirOnTrigger
    gasAdjustments:
      nitrousoxide: 300
    range: 1
  - type: EmitSoundOnTrigger
    sound:
      path: "/Audio/Effects/spray.ogg"
    positional: true
  - type: DeleteOnTrigger
  - type: Appearance
  - type: StaticPrice
    price: 85
  - type: TimerTriggerVisuals

- type: entity
  parent: BasePowerCell
  id: CrystalCell
  name: crystal cell
  description: A non rechargeable cell with a huge power capacity.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Power/crystal_cell.rsi
    layers:
    - state: crystal_cell
  - type: Battery
    maxCharge: 25000
    startingCharge: 25000
    pricePerJoule: 0.01
  - type: Tag
    tags:
    - NoRecharge
  - type: EmpImmune #Dumont