# Medipens

- type: entity
  parent: [BaseCartridgeAutoinjector, BaseSyndicateContraband]
  id: SyndicateHypo
  name: syndicate cartridge autoinjector
  description: A faster cartridge autoinjector in Syndicate colors.
  components:
  - type: Item
    sprite: _Funkystation/Objects/Medical/dagd_autoinjector.rsi
  - type: Sprite
    sprite: _Funkystation/Objects/Medical/dagd_autoinjector.rsi
    layers:
    - state: syndicate-base
    - state: cartridge1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 15
  - type: Hypospray
    transferAmount: 15
  - type: UseDelay
    delay: 20
