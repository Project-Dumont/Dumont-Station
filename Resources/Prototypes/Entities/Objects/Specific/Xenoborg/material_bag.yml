- type: entity
  parent: [ BaseStorageItem, BaseXenoborgContraband ]
  id: MaterialBag
  name: material bag
  description: A robust bag for Xenoborgs to carry large amounts of materials.
  components:
  - type: MagnetPickup
  - type: Sprite
    sprite: Objects/Specific/Mining/ore_bag.rsi
    state: icon
  - type: Clothing
    sprite: Objects/Specific/Mining/ore_bag.rsi
    quickEquip: false
    slots:
    - belt
  - type: Item
    size: Ginormous
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,9,3
    quickInsert: true
    areaInsert: true
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: Dumpable

- type: entity
  parent: ClothingBackpack
  id: XenoborgMaterialBag
  name: silicon storage square
  description: A knockoff version of a bluespace bag, can vacuum up select materials, unfit for use by humanoids due to harmful emissions.
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/silicon_storage_cube.rsi
    state: xenoborg
  - type: MagnetPickup
  - type: Dumpable
  - type: Storage
    grid:
    - 0,0,7,3
    quickInsert: true
    areaInsert: true
    whitelist:
      tags:
        - Sheet
        - ConstructionMaterial
        - RawMaterial
        - Ingot
        - XenoborgCrystal
      components:
        - Circuitboard
        - Flatpack
        - FloorTile
    blacklist:
      components:
      - SiliconLawProvider
