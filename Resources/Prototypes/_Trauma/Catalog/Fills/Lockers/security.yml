
- type: entity
  parent: [GunSafeBaseSecure, BaseSecurityContraband]
  id: GunSafeSurplus
  name: surplus ballistic safe
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: FillGunSafeSurplus

- type: entityTable
  id: FillGunSafeSurplus
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: GunSafeSurplusTable
      rolls: !type:RangeNumberSelector
        range: 3, 5

- type: entityTable
  id: GunSafeSurplusTable
  table: !type:GroupSelector
    children:
    - id: WeaponRifleLecter
    - id: WeaponShotgunKammerer
    - id: WeaponSubMachineGunDrozd
    - id: WeaponPistolMk58
    - id: WeaponRevolverInspector
#    - id: WeaponShotgunDoubleBarreled
    - !type:GroupSelector
      weight: 0.3 # rarer weapons that deviate from the standard armory weapons from before
      children:
      - id: WeaponShotgunEnforcer # really good gun
      - id: WeaponSubMachineGunWt550 # everyone complained from it being a bad gun
      - id: WeaponShotgunDoubleBarreled # really bad gun

