- type: entity
  parent: MaterialBase
  id: Whetstone
  name: whetstone
  description: A whetstone, used to maintain bladed weapons.
  suffix: full
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Tools/whetstone.rsi
    state: icon
  - type: Appearance
  - type: Stack
    stackType: Whetstone
    count: 5
  - type: Item
    sprite: _Trauma/Objects/Tools/whetstone.rsi
    storedOffset: 0,-1
    storedRotation: 15
    size: Small
    shape:
    - 0,0,1,0
  - type: Construction
    graph: Whetstone
    node: finish
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Whetstone: 100
  - type: CustomDurabilityModifier
    maxDurabilityStateModifiers:
      Reinforced: 2, 1.15 # Either +2 damage or +15% damage, whichever is less
  - type: Tool
    qualities:
    - Sharpening
    speedModifier: 0.5
    useSound:
      path: /Audio/_Trauma/Tools/whetstone.ogg

- type: entity
  parent: Whetstone
  id: Whetstone1
  suffix: Single
  components:
  - type: Stack
    count: 1
- type: entity
  parent: MaterialBase
  id: Brick
  name: brick
  suffix: Full
  description: An insulative brick, perfect for a bloomery.
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Materials/materials.rsi
    state: brick
    layers:
    - state: brick
      map: ["base"]
  - type: Appearance
  - type: Stack
    stackType: Brick
    count: 30
    baseLayer: base
    layerStates:
    - brick
    - brick_2
    - brick_3
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Brick: 100
  - type: Item
    sprite: _Trauma/Objects/Materials/materials.rsi
    heldPrefix: brick

- type: entity
  parent: Brick
  id: Brick1
  suffix: Single
  components:
  - type: Stack
    count: 1
- type: material
  id: Brick
  stackEntity: Brick1
  name: materials-brick
  unit: materials-unit-piece
  icon: { sprite: _Trauma/Objects/Materials/materials.rsi, state: brick }
  color: "#b6946d"
  price: 0.1 # $10 for 1 unit

- type: material
  id: Whetstone
  stackEntity: Whetstone1
  name: materials-whetstone
  unit: materials-unit-use
  icon: { sprite: _Trauma/Objects/Tools/whetstone.rsi, state: icon }
  color: "#000000"
  price: 0
- type: stack
  maxCount: 30
  id: Brick
  name: stack-brick
  icon: { sprite: /Textures/_Trauma/Objects/Materials/materials.rsi, state: brick }
  spawn: Brick1

- type: stack
  maxCount: 5
  id: Whetstone
  name: stack-whetstone
  icon: { sprite: /Textures/_Trauma/Objects/Tools/whetstone.rsi, state: icon }
  spawn: Whetstone1
- type: constructionGraph
  id: Whetstone
  graph:
  - node: start
    edges:
    - to: finish
      completed:
        - !type:SetStackCount
          amount: 1
      steps:
        - material: Steel
          amount: 1
        - material: Brick
          amount: 1
  - node: finish
    entity: Whetstone
- type: construction
  targetNode: finish
  category: construction-category-tools
  objectType: Item
  id: Whetstone
  graph: Whetstone
- type: tool
  id: Sharpening
  name: tool-quality-sharpening-name
  toolName: tool-quality-sharpening-tool-name
  spawn: Whetstone
  icon: { sprite: _Trauma/Objects/Tools/whetstone.rsi, state: icon }
