- type: entity
  parent:
    - BaseSyndicateContraband
    - BaseShellShotgun
  id: ShellShotgunHypo
  name: shell (12 Gauge hypo)
  components:
    - type: Sprite
      sprite: _Trauma/Objects/Weapons/Guns/Ammunition/Casings/shotgun_shell.rsi
      layers:
        - state: hypo
          map: [ "enum.AmmoVisualLayers.Base" ]
    - type: CartridgeAmmo
      proto: PelletShotgunTranquilizer
    - type: ChemicalAmmo
    - type: SolutionContainerManager
      solutions:
        ammo:
          maxVol: 7
    - type: RefillableSolution
      solution: ammo
    - type: InjectableSolution
      solution: ammo
    - type: SolutionTransfer
      maxTransferAmount: 7
    - type: SpentAmmoVisuals
      state: "hypo"
