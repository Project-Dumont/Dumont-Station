- type: entity
  parent: CigarGoldCase
  id: CigarGoldSyndicateCase
  components:
    - type: EntityTableContainerFill
      containers:
        storagebase:
          id: CigarGoldSyndicate
          amount: 8
    - type: StorageFill
      contents: []
- type: entity # pretty much useless if not equipped in mask slot
  parent: CigarGold
  id: CigarGoldSyndicate
  suffix: Explosive
  components:
    - type: ExplosiveCigar
      triggerAtRemaining: 5
    - type: TriggerConditionInSlot
      slot: mask
    - type: DamageOnTrigger
      keysIn:
        - timer
      targetUser: true
      damage:
        types:
          Blunt: 250
          Slash: 50
      targetPart: Head
    - type: Explosive
      explosionType: Default
      maxIntensity: 1
      intensitySlope: 5
      totalIntensity: 5
      canCreateVacuum: false
