- type: entity
  parent: BriefcaseWeapon
  id: BriefcaseWeaponSmall
  suffix: Gun, Small, Empty
  components:
    - type: Sprite
      sprite: Objects/Storage/Briefcases/weapon_case.rsi
    - type: Item
      size: Ginormous
    - type: Storage
      maxItemSize: Ginormous
      grid:
        - 0,0,3,1

- type: entity
  parent:
    - BriefcaseBase
    - BaseSyndicateContraband
  id: BriefcaseWeapon
  name: secure weapon case
  suffix: Gun, Empty
  description: Useful for aspiring mercenaries, whether you're fighting for a company, a nation or anyone else. Or just
    making a really big omelette.
  components:
    # <Trauma>
    - type: Storage
      grid:
        - 0,0,6,3
      maxItemSize: Ginormous
    # </Trauma>
    - type: Appearance
    - type: Sprite
      sprite: Objects/Storage/Briefcases/weapon_case_large.rsi
      layers:
        - state: icon
          map: [ base ]
        - state: locked
          map: [ "enum.LockVisualLayers.Lock" ]
          shader: unshaded
        - state: unlocked
          map: [ light ]
          shader: unshaded
    - type: Lock
    - type: LockVisuals
    - type: GenericVisualizer
      visuals:
        enum.StorageVisuals.Open:
          base:
            True: { state: icon-open }
            False: { state: icon }
          light:
            True: { visible: true }
            False: { visible: false }
