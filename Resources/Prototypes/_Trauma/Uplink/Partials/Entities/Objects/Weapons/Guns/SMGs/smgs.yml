- type: entity
  name: brown briefcase
  parent: BaseWeaponSubMachineGun
  id: WeaponSubMachineGunBriefcase
  description: Useful for carrying items in your hands.
  suffix: Gun
  components:
    - type: Item
      size: Ginormous
      shape:
        - 0,0,4,3
      inhandVisuals:
        left:
          - sprite: Objects/Storage/Briefcases/briefcase_brown.rsi
            state: inhand-left
          - state: inhand-left-muzzle
        right:
          - sprite: Objects/Storage/Briefcases/briefcase_brown.rsi
            state: inhand-right
          - state: inhand-right-muzzle
    - type: Sprite
      sprite: _Trauma/Objects/Weapons/Guns/SMGs/briefcase_brown.rsi
      layers:
        - sprite: Objects/Storage/Briefcases/briefcase_brown.rsi
          state: icon
        - state: icon-muzzle
          map: [ "enum.GunVisualLayers.Base" ]
    - type: Gun
      fireRate: 6 # was 9
      minAngle: 25
      maxAngle: 32
      availableModes:
        - FullAuto
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/atreides.ogg
    - type: ChamberMagazineAmmoProvider
      autoEject: false
    - type: Appearance
    - type: StaticPrice
      price: 5000
    - type: MeleeWeapon
      damage:
        types:
          Blunt: 8
