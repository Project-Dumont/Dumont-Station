- type: entity
  parent: [ PartReptilian, BaseTail ]
  id: TailReptilian
  name: reptilian tail
  components:
  - type: Sprite
    sprite: _Trauma/Mobs/Species/Reptilian/parts.rsi
    state: tail
  - type: Icon
    sprite: _Trauma/Mobs/Species/Reptilian/parts.rsi
    state: tail
  - type: PullerTail
    speciesWhitelist:
    # need to have a body adapted to controlling a tail properly
    - Reptilian
    - Kobold
    - Monkey
  - type: BodyPart
    onAdd:
    - type: Wagging

- type: entity
  parent: TailReptilian
  id: TailReptilianDefault
  suffix: Reptilian, Default
  components:
  - type: Sprite
    color: "#33A222FF"
  - type: BodyPartAppearance
    visLayers: Tail
    iD: MobHumanoidAnyMarking
    color: "#33A222FF"
    markings:
      Tail:
      - markingId: LizardTailSmooth
        markingColor: [ "#33A222FF" ]

