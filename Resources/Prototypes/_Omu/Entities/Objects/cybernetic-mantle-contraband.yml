    allowedDepartments: [Medical, Command]
    allowedJobs: [Brigmedic, BlueshieldOfficer]

- type: entity
  id: BaseScienceCommandContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [Science, Command]

- type: entity
  id: BaseEngineeringCommandContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [Engineering, Command]

- type: entity
  id: BaseBrigmedicContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedJobs: [Brigmedic]
