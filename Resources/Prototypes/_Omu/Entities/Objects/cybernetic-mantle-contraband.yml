# Department combinations used by the ported mantles.

- type: entity
  id: BaseBartenderContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedJobs: [Bartender]

- type: entity
  id: BaseCargoCommandContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedDepartments: [Cargo, Command]

- type: entity
  id: BaseMedicalCommandContraband
  parent: BaseRestrictedContraband
