- type: entity
  parent: IDCardStandard
  id: AdminAssistantIDCard
  name: administrative assistant ID card
  components:
  - type: Sprite
    layers:
    - state: silver
    - state: idadminassistant
  - type: Item
    heldPrefix: silver
  - type: PresetIdCard
    job: AdministrativeAssistant

# Security
- type: entity
  parent: IDCardStandard
  id: PrisonGuardIDCard
  name: prison guard ID card
  components:
  - type: Sprite
    layers:
    - state: default
    - state: stripe_top
      color: &color-security-top "#39393c"
    - state: stripe_bottom
      color: &color-security-bottom "#262626"
    - sprite: *icon-rsi-dv
      offset:
      state: nyanoPrisonGuard
  - type: PresetIdCard
    job: PrisonGuard
