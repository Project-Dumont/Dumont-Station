- type: entity
  id: BaseBorgModuleSecurity
  parent: BaseBorgModule
  abstract: true
  components:
  - type: Tag
    tags:
    - BorgModuleSecurity
  - type: Sprite
    sprite: _DV/Objects/Specific/Robotics/borgmodule.rsi

# Security Modules

- type: entity
  id: BorgModuleSecurityPatrol # Available on Round Start
  parent: [ BaseBorgModuleSecurity, BaseProviderBorgModule ]
  name: patrol cyborg module
  components:
  - type: Sprite
    layers:
    - state: security
    - state: icon-patrol
  - type: ItemBorgModule
    hands:
    - item: HoloprojectorSecurityRecharging
    - item: FlashlightSecliteRecharging
    - item: SecurityWhistle
  - type: BorgModuleIcon
    icon: { sprite: _Gabystation/Interface/Actions/actions_borg.rsi, state: patrol-module }

- type: entity
  id: BorgModuleSecurityBastion # Research Locked - AdvancedRiotControl
  parent: [ BaseBorgModuleSecurity, BaseProviderBorgModule ]
  name: bastion cyborg module
  components:
  - type: Sprite
    layers:
    - state: security
    - state: icon-hold
  - type: ItemBorgModule
    hands:
    - item: WeaponLauncherNonLethalBorg
    - item: FlashRecharging
    - item: SecurityWhistle
  - type: BorgModuleIcon
    icon: { sprite: _Gabystation/Interface/Actions/actions_borg.rsi, state: bastion-module }

- type: entity
  id: BorgModuleSecurityDeescalate # Available on Round Start
  parent: [ BaseBorgModuleSecurity, BaseProviderBorgModule ]
  name: de-escalation cyborg module
  components:
  - type: Sprite
    layers:
    - state: security
    - state: icon-detain
  - type: ItemBorgModule
    hands:
    - item: StunbatonSelfCharging
    - item: FlashRecharging
    - item: FlashlightSecliteRecharging
    - item: SecurityWhistle
    - item: Handcuffs
      hand:
        emptyLabel: borg-slot-cuffs-empty
        emptyRepresentative: Handcuffs
        whitelist:
          components:
          - Handcuff
    - item: Zipties
      hand:
        emptyLabel: borg-slot-cuffs-empty
        emptyRepresentative: Zipties
        whitelist:
          components:
          - Handcuff
  - type: BorgModuleIcon
    icon: { sprite: _Gabystation/Interface/Actions/actions_borg.rsi, state: deescalate-module }

- type: entity
  id: BorgModuleSecurityEscalate
  parent: [ BaseBorgModuleSecurity, BaseProviderBorgModule ]
  name: escalation cyborg module
  description: Peace was never an option.
  components:
  - type: Sprite
    layers:
    - state: security
    - state: icon-hurt
  - type: ItemBorgModule
    hands:
    - item: WeaponRiotShotgunBorg
    - item: Truncheon # Anti-Fauna option to stop them being relied on the Seclite (which will be removed when the Laws menu is fixed)
    - item: CombatKnife # Anti-fauna for blunt resistant slimes
    - item: SecurityWhistle
  - type: BorgModuleIcon
    icon: { sprite: _Gabystation/Interface/Actions/actions_borg.rsi, state: escalate-module }

- type: entity
  id: BorgModuleSecurityChase # Research Locked - NonLethalAmmunition
  parent: [ BaseBorgModuleSecurity, BaseProviderBorgModule ]
  name: chase cyborg module
  components:
  - type: Sprite
    layers:
    - state: security
    - state: icon-chase
  - type: ItemBorgModule
    hands:
    - item: WeaponDisablerRecharging
    - item: FlashlightSecliteRecharging
    - item: SecurityWhistle
  - type: BorgModuleIcon
    icon: { sprite: _Gabystation/Interface/Actions/actions_borg.rsi, state: chase-module }
