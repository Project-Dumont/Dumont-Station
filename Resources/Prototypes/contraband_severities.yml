# Improvised weapons/gear, etc. Not departmentally restricted per se, but you shouldn't really have it around
# as non-sec without a valid reason.
- type: contrabandSeverity
  id: Minor
  examineText: contraband-examine-text-Minor

# Dangerous fucking shit that doesn't belong to CyberSun or NanoTrasen, RPGs, retro laser blasters, unholy things
- type: contrabandSeverity
  id: Major
  examineText: contraband-examine-text-Major

# Having this without a good reason might get you yelled at by security. (spears, shivs, etc).
# or, Having this as a regular crew member, not the department it was made for, is considered theft IC. (rcd, sec gear, etc)
- type: contrabandSeverity
  id: Restricted
  examineText: contraband-examine-text-Restricted
  showDepartmentsAndJobs: true

# Having this as a regular crew member is considered grand theft. (nuke disk, captain's gear, objective items, etc)
- type: contrabandSeverity
  id: GrandTheft
  examineText: contraband-examine-text-GrandTheft

# This is clear syndicate contraband and is illegal to own IC.
- type: contrabandSeverity
  id: Syndicate
  examineText: contraband-examine-text-Syndicate

# This is magical contraband and not permitted to be used IC.
- type: contrabandSeverity
  id: Magical
  examineText: contraband-examine-text-Magical

# These toys belong to the clown, give them back or get honked
- type: contrabandSeverity
  id: Honkraband 
  examineText: contraband-examine-text-Clown


# Dumont spacelaw 2.0 - sub categories for contra
# This item is not dangerous, but it belongs to a department in the station.
- type: contrabandSeverity
  id: DepartmentalEquipment
  examineText: contraband-examine-text-Departmental

# This item is not inherently dangerous unless you use it a specific way, and belongs to a department in the station.
- type: contrabandSeverity
  id: RestrictedEquipment
  examineText: contraband-examine-text-Restricted-Equipment
  showDepartmentsAndJobs: true

# This contraband can be used for harm, and belongs to a department in the station
- type: contrabandSeverity
  id: DangerousEquipment
  examineText: contraband-examine-text-Dangerous
  showDepartmentsAndJobs: true

# this contraband can be easily used to kill someone, and belongs to a department in the station
- type: contrabandSeverity
  id: LethalEquipment
  examineText: contraband-examine-text-Lethal
  showDepartmentsAndJobs: true

# this contraband is incredibly important or dangerous, and belongs to someone in the station
- type: contrabandSeverity
  id: CriticalEquipment
  examineText: contraband-examine-text-Critical
  showDepartmentsAndJobs: true

# this is not inherently dangerous and is not legalized
- type: contrabandSeverity
  id: RestrictedExternal
  examineText: contraband-examine-text-External-Restricted

# this is dangerous and is not legalized
- type: contrabandSeverity
  id: DangerousExternal
  examineText: contraband-examine-text-External-Dangerous

# this can be easily used to kill someone, and is not legalized
- type: contrabandSeverity
  id: LethalExternal
  examineText: contraband-examine-text-External-Lethal

# this is incredibly dangerous, and is not legalized
- type: contrabandSeverity
  id: CriticalExternal
  examineText: contraband-examine-text-External-Critical

# this is not inherently dangerous and is from the syndicate
- type: contrabandSeverity
  id: RestrictedSyndicate
  examineText: contraband-examine-text-Syndicate-Restricted

# this is dangerous and is from the syndicate
- type: contrabandSeverity
  id: DangerousSyndicate
  examineText: contraband-examine-text-Syndicate-Dangerous

# this can easily be used to kill someone and is from the syndicate
- type: contrabandSeverity
  id: LethalSyndicate
  examineText: contraband-examine-text-Syndicate-Lethal

# this is incredibly dangerous and is from the syndicate
- type: contrabandSeverity
  id: CriticalSyndicate
  examineText: contraband-examine-text-Syndicate-Critical