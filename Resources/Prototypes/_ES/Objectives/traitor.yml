- type: entity
  abstract: true
  parent: BaseTraitorObjective
  id: ESBaseSabotageObjective
  components:
  - type: Objective
    difficulty: 1.5
  - type: CodeCondition

- type: entity
  parent: ESBaseSabotageObjective
  id: ESObjectiveTraitorSabotageCommunications
  name: Sabotage the communications computer
  description: Use the sabotage verb on a powered communications computer on your station. Disrupt Nanotrasen's announcements.
  components:
  - type: Objective
    icon:
      sprite: Structures/Machines/computers.rsi
      state: comm
  - type: SabotageCondition
    whitelist:
      components:
      - CommunicationsConsole

- type: weightedRandom
  id: TraitorObjectiveGroupSabotage
  weights:
    ESObjectiveTraitorSabotageCommunications: 1
    ESObjectiveTraitorSabotageTelecom: 1

- type: entity
  parent: ESBaseSabotageObjective
  id: ESObjectiveTraitorSabotageTelecom
  name: Sabotage a telecommunication server
  description: Use the sabotage verb on a powered telecommunication server on your station. Its radio channels will be scrambled until repaired.
  components:
  - type: Objective
    icon:
      sprite: Structures/Machines/telecomms.rsi
      state: telecom-on
  - type: SabotageCondition
    whitelist:
      components:
      - TelecomServer
