- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseConspiratorObjective
  components:
  - type: Objective
    issuer: conspirator-objective-issuer
    difficulty: 0 # uses own system for assignment
  - type: RoleRequirement
    roles:
    - ConspiratorRole
  - type: NoCompletionObjective

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorUnionObjective
  name: Tome o controle de um departamento à força ou não.
  description: Assuma o controle direto de um departamento, seja por meio da força ou manipulação e declare independência da Nanotrasen!
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Melee/stunprod.rsi
      state: stunprod_off

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorGameshowObjective
  name: Realize um show de vida ou morte
  description: Force a tripulação a participar de um game show com apostas incríveis.
  components:
  - type: Objective
    icon:
      sprite: Structures/Machines/computers.rsi
      state: television

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorTechnologyObjective
  name: Experimente toda a tecnologia da estação.
  description: Mostre à tripulação os méritos de uma vida mais simples. Porque só você merece as maravilhas da tecnologia.
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Melee/baseball_bat.rsi
      state: icon

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorArmsObjective
  name: Desarme a segurança e se armem em vez disso
  description: Pegue as armas da segurança e dê elas para si mesmos. Eles não podem ser confiados com elas.
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Guns/Pistols/mk58.rsi
      state: icon

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorThiefObjective
  name: Realize o maior assalto de todos os tempos
  description: Façam seus nomes ficarem nos livros de história pelo que vocês tirarem desta estação.
  components:
  - type: Objective
    icon:
      sprite: Objects/Tools/thief_beacon.rsi
      state: extraction_point

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorMafiaObjective
  name: Forme uma família do crime
  description: Torne-se o líder do crime nesta estação e cimente sua reputação como um grupo que deve ser temido.
  components:
  - type: Objective
    icon:
      sprite: Clothing/Head/Hats/outlawhat.rsi
      state: icon

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorCultObjective
  name: Forme um culto perigoso
  description: Estabeleçam-se como um culto que adora o que vocês desejam, eliminem quaisquer outros cultistas rivais.
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Melee/cult_dagger.rsi
      state: icon

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorPetObjective
  name: Substitua o Comando pelo seus pets
  description: O Ian é provavelmente mais competente do que o Chefe dos Funcionários, de qualquer forma
  components:
  - type: Objective
    icon:
      sprite: Mobs/Pets/corgi.rsi
      state: ian

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorBanquetObjective
  name: Faça um grande banquete de carne dos mascote da estação
  description: Descubra por que o Sindicato quer que o Ian seja multilado tão desesperadamente.
  components:
  - type: Objective
    icon:
      sprite: Objects/Consumable/Food/meat.rsi
      state: corgi

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorArrestObjective
  name: Engane a Segurança para que prendam pessoas inocentes.
  description:  Demonstre a incompetência deles mostrando o quão fácil é enganá-los.
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Melee/stunbaton.rsi
      state: stunbaton_off

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorCameraObjective
  name: Desmantele todos os sistemas de vigilância da estação
  description: Traga de volta o direito à privacidade para os funcionários da Nanotrasen.
  components:
  - type: Objective
    icon:
      sprite: Mobs/Silicon/station_ai.rsi
      state: ai_camera
