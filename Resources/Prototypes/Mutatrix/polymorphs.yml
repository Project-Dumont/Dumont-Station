# BaseMobAsteroid is abstract in Dumont, so this entry uses MobHivelord as the
# generic concrete asteroid-fauna representative for now. Scanner sources still
# include BaseMobAsteroid so derived asteroid fauna can map to this DNA.
- type: polymorph
  id: MutatrixBaseMobAsteroidPolymorph
