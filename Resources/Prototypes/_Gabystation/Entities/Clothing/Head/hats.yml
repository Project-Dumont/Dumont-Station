- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatCapMarinheiro
  name: Chapéu de Marinheiro
  description: Mar calmo não faz bons capitães está escrito no chapéu. Um lembrete de quando se velejava por mares de água salgada e não pelo vazio do espaço.
  components:
  - type: Sprite
    sprite: _Gabystation/Clothing/Head/Hats/cap_marinheiro.rsi
  - type: Clothing
    sprite: _Gabystation/Clothing/Head/Hats/cap_marinheiro.rsi
  - type: Item
    sprite: _Gabystation/Clothing/Head/Hats/cap_marinheiro.rsi
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-inanimate
    weight: 0.0002 # 5,000 times less likely than 1 regular animal
  - type: BlockMovement
  - type: Armor # Goob
    coverage:
    - Head
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.8

