- type: entity
  id: MedicalLaserGunCMO
  name: chief medical officer's medical laser gun
  parent: [ BaseWeaponBattery, BaseGrandTheftContraband ]
  description: A highly experimental prototype of the medical beam gun, designed for the chief medical officer.
  components:
  - type: Sprite
    sprite: _Gabystation/Objects/Weapons/Guns/Battery/cmogun.rsi
    state: icon
  - type: Item
    sprite: _Gabystation/Objects/Weapons/Guns/Battery/cmogun.rsi
    size: Large
  - type: Clothing
    sprite: _Gabystation/Objects/Weapons/Guns/Battery/cmogun.rsi
    quickEquip: false
    clothingVisuals:
        suitstorage:
            - state: equipped-SUITSTORAGE
  - type: Gun
    soundGunshot:
      path: /Audio/_Gabystation/Weapons/Guns/Gunshots/laserhigh.ogg
      params:
        volume: -4
    soundEmpty:
      path: /Audio/_DV/Weapons/Guns/Empty/dry_fire.ogg
    fireRate: 2.0
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: Battery
    maxCharge: 1500
    startingCharge: 1500
  - type: ProjectileBatteryAmmoProvider
    proto: HealingProjectile
    fireCost: 50 #30 tiros
  - type: PacifismAllowedGun
  - type: StealTarget
    stealGroup: CMOweapon
  - type: Tag
    tags:
    - HighRiskItem
    - GunCanAimShooter


- type: entity
  name: chief medical officer's autoinjector gun
  parent: [BaseGrandTheftContraband, BaseGunWieldable, BaseItem]
  id: CMOAutoinjectorGun
  description: Shoots autoinjector cartridges. Must be hand loaded.
  components:
  - type: AmmoCounter
  - type: Sprite
    sprite: _Dumont/Objects/Specific/Medical/cmo_sniper_icon_48x.rsi
    state: icon
  - type: PacifismAllowedGun
  - type: Item
    sprite: _Dumont/Objects/Specific/Medical/cmo_sniper.rsi
    size: Large
  - type: Gun
    fireRate: 0.5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Goobstation/Weapons/Guns/Gunshots/heavy_shot_suppressed.ogg
  - type: BallisticAmmoProvider
    autoEject: false
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg
    soundRack: #Mono start
      path: /Audio/Weapons/Guns/Cock/sf_rifle_cock.ogg
      params:
        volume: -3 #Mono end
    whitelist:
      tags:
      - AutoinjectorCartridge
    capacity: 5
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: StaticPrice
    price: 1000
  - type: Clothing
    sprite: _Dumont/Objects/Specific/Medical/cmo_sniper.rsi
    quickEquip: false
    slots:
    - suitStorage
    - outerClothing # so the cmo doesn't have to wear hardsuit 24/7
  - type: EmitSoundOnPickup
    sound:
      collection: SnipersPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: SnipersDrop
  - type: EmitSoundOnLand
    sound:
      collection: SnipersDrop
  - type: AltFireMelee 
    attackType: Heavy
  - type: MeleeWeapon
    damage:
      types:
       Blunt: 12
    angle: 0
    wideAnimationRotation: 90 
    soundHit:
      collection: MetalThud 
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 1.2
    pvsIncrease: 0.2
  - type: StealTarget
    stealGroup: CMOweapon
  - type: Tag
    tags:
    - HighRiskItem
    - GunCanAimShooter