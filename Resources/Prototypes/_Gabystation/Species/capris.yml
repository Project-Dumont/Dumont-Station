- type: species
  id: Capris
  name: species-name-capris
  roundStart: true
  prototype: MobCapris
  sprites: MobCaprisSprites
  markingLimits: MobCaprisMarkingLimits
  dollPrototype: MobCaprisDummy
  skinColoration: AnimalFur
  minHeight: 0.90
  defaultHeight: 1.00
  maxHeight: 1.10
  minWidth: 0.90
  defaultWidth: 1.00
  maxWidth: 1.10

- type: markingPoints
  id: MobCaprisMarkingLimits
  onlyWhitelisted: true
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Snout:
      points: 1
      required: true
      defaultMarkings: [ CaprisSnoutNormal ]
    Tail:
      points: 1
      required: true
      defaultMarkings: [ CaprisTailNormal ]
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ CaprisHornsFront ]
    HeadSide:
      points: 1
      required: true
      defaultMarkings: [ CaprisEarsNormal ]
    Face:
      points: 2
      required: true
      defaultMarkings: [ CaprisSnoutNose ]
    Chest:
      points: 10
      required: false
    Underwear:
      points: 1
      required: false
    Undershirt:
      points: 1
      required: false
    RightLeg:
      points: 2
      required: false
    RightFoot:
      points: 2
      required: false
    LeftLeg:
      points: 2
      required: false
    LeftFoot:
      points: 2
      required: false
    RightArm:
      points: 2
      required: false
    RightHand:
      points: 3
      required: false
    LeftArm:
      points: 2
      required: false
    LeftHand:
      points: 3
      required: false

