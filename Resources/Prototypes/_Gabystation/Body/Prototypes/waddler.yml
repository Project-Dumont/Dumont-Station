- type: body
  name: "waddler"
  id: Waddler
  root: chest
  slots:
    head:
      part: HeadWaddler
      connections:
      - chest
      organs:
        brain: OrganHumanBrain
        eyes: OrganHumanEyes
    chest:
      part: ChestWaddler
      organs:
        heart: OrganAnimalHeart
        lungs: OrganHumanLungs
        stomach: OrganAnimalStomach
        liver: OrganAnimalLiver
        kidneys: OrganHumanKidneys
      connections:
      - groin
      - right arm
      - left arm
      - head # Shitmed
    groin:
      part: GroinWaddler
      connections:
      - right leg
      - left leg
    right hand:
      part: RightHandWaddler
    left hand:
      part: LeftHandWaddler
    right arm:
      part: RightArmWaddler
      connections:
      - right hand
    left arm:
      part: LeftArmWaddler
      connections:
      - left hand
    right leg:
      part: RightLegWaddler
      connections:
      - right foot
    left leg:
      part: LeftLegWaddler
      connections:
      - left foot
    right foot:
      part: RightFootWaddler
    left foot:
      part: LeftFootWaddler



