- type: accent
  id: nipoPortuguese
  regexReplacements:
    "nh": "ny"
    "lh": "ry"
    "([t])([r])": "$1u$2"
    "(?<!n)(?<!l)(?<!c)(?<!r)(?<!s)([bdfghjklpqrsçvwxz])([bcdfgjklmnpqrctçvwxz])": "$1u$2"
    "(?<!n)(?<!l)(?<!c)(?<!r)(?<!s)([bcdfghjklpqrçvwxz])([bcdfgjklmnpqrstçvwxz])": "$1u$2"
    "x": "kus"
    "([bcdfghjklpqstvwçz])\\b": "$1u"
    "([r])\\b": "h"
    "l([aeiouáàâãéêíóôõúü])": "r$1"
