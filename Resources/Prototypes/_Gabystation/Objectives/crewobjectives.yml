  - type: PickRandomPerson

- type: entity
  parent: [BaseCrewObjective]
  id: PlayChessCrewObjective
  name: Jogue xadrez com alguém.
  description: Desafie alguém com um jogo de xadrez, e termine o jogo, vencendo ou perdendo.
  components:
  - type: Objective
    icon:
      sprite: Objects/Fun/Tabletop/chessboard.rsi
      state: chessboard

- type: entity
