- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseCrewObjective
  components:
  - type: Objective
    difficulty: 0
    issuer: objective-issuer-personal
  - type: RoleplayObjective
#All
- type: entity
  parent: [BaseCrewObjective]
  id: TransferCrewObjective
  name: Mude de emprego, subitamente.
  description: Você não queria estar com esse emprego, e tinha medo de desapontar seus pais, mas agora você não aguenta mais. Durante o turno, seja transferido de departamento sem pedir diretamente, ou ser demitido, ou demotado.
  components:
  - type: Objective
    icon:
      sprite: Objects/Storage/Briefcases/briefcase_brown.rsi
      state: icon

- type: entity
  parent: [BaseCrewObjective, BaseSocialObjective]
  id: InteractWithCrewObjective
  description: Esse tripulante parece uma pessoa interessante. Talvez seja uma boa ideia interagir com ele e aprender a sua história.
  components:
  - type: Objective
    icon:
      sprite: Objects/Misc/folders.rsi
      state: folder-white
  - type: TargetObjective
    title: objective-condition-interact-with-crew-title
  - type: PickRandomPerson

- type: entity
  parent: [BaseCrewObjective, BaseSocialObjective]
  id: FavorCrewObjective
  description: Você deve um favor a esse tripulante. Ajude eles com algo pra retornar esse favor.
