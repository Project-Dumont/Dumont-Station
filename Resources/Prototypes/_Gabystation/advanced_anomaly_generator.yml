- type: entity
  id: MachineAdvancedAnomalyGenerator
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: advanced anomaly generator
  description: A high-precision anomalous projector that can open a chosen anomaly at a validated station tile.
  placement:
    mode: AlignTileAny
  components:
  - type: StationAiWhitelist
  - type: SpriteFade
  - type: Sprite
    sprite: _Gabystation/Structures/Machines/Anomaly/advanced_anomaly_generator.rsi
    offset: 0,1
    drawdepth: Mobs
    layers:
    - state: base
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
    - state: unshaded
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      visible: false
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: generating
      visible: false
      shader: unshaded
      map: ["enum.AdvancedAnomalyGeneratorVisualLayers.Base"]
  - type: Transform
    anchored: true
  - type: ApcPowerReceiver
    powerLoad: 2500
  - type: ExtensionCableReceiver
  - type: AmbientSound
    range: 5
    volume: -6
    sound:
      path: /Audio/Ambience/Objects/anomaly_generator.ogg
  - type: Physics
    bodyType: Static
  - type: AdvancedAnomalyGenerator
    requiredMaterial: Plasma
    materialCost: 1500
    generationLength: 8
    generatingSound:
      path: /Audio/Machines/anomaly_generate.ogg
    generatingFinishedSound:
      path: /Audio/Machines/beep.ogg
    allowedAnomalies:
    - AdvancedAnomalyPyroclastic
    - AdvancedAnomalyGravity
    - AdvancedAnomalyElectricity
    - AdvancedAnomalyIce
    - AdvancedAnomalyFlora
    - AdvancedAnomalyBluespace
    - AdvancedAnomalyTech
    - AdvancedAnomalyRock
    - AdvancedAnomalySanta
    - AdvancedAnomalyShadow
  - type: ResearchClient
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
    materialWhiteList:
    - Plasma
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.5,-0.5,1.5,0.6"
        density: 50
        mask:
        - LargeMobMask
        layer:
        - WallLayer
  - type: Repairable
    fuelCost: 10
    doAfterDelay: 5
  - type: WiresPanel
  - type: Wires
    boardName: wires-board-name-advancedanomalygenerator
    layoutId: AnomalyGenerator
  - type: Machine
    board: AdvancedAnomalyGeneratorCircuitboard
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage"]
  - type: ActivatableUI
    key: enum.AdvancedAnomalyGeneratorUiKey.Key
  - type: ActivatableUIRequiresAccess
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.AdvancedAnomalyGeneratorUiKey.Key:
        type: AdvancedAnomalyGeneratorBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.AdvancedAnomalyGeneratorVisualLayers.Base:
        enum.AdvancedAnomalyGeneratorVisualLayers.Base:
          True: { visible: true }
          False: { visible: false }
  - type: WiresVisuals
  - type: StaticPrice
    price: 7000
  - type: AccessReader
    access: [["Research"]]
  - type: GuideHelp
    guides:
    - AnomalousResearch

- type: entity
  parent: BaseMachineCircuitboard
  id: AdvancedAnomalyGeneratorCircuitboard
  name: advanced anomaly generator machine board
  description: A machine printed circuit board for an advanced anomaly generator.
  components:
  - type: Sprite
    state: science
  - type: MachineBoard
    prototype: MachineAdvancedAnomalyGenerator
    stackRequirements:
      Manipulator: 8
      Cable: 5
      Glass: 20
      Steel: 30
      Uranium: 2
