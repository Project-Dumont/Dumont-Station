    useDelay: 30
    icon: { sprite: _Gabystation/OniCharge/ChargeOni.rsi, state: Charge }
    itemIconStyle: NoItem
    sound: !type:SoundPathSpecifier
      path: /Audio/_Gabystation/ChargeOni/ChargeHeavy.ogg
      params:
        volume: 8
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: WorldTargetAction
    event: !type:DashActionEvent
      distance: 7
      speed: 11.5
      staminaDrain: 50
      emote: null