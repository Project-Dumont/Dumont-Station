- type: entityTable
  id: ReactorWalls
  table: !type:GroupSelector
    children:
    - id: SignRadiationMed
    - id: ExtinguisherCabinetFilled
      prob: 0.2
    - id: FireAxeCabinetFilled
      prob: 0.1
    - id: IntercomEngineering
      prob: 0.1