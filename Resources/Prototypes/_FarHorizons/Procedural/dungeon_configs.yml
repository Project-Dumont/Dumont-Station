- type: dungeonConfig
  id: Reactor
  layers:
  - !type:PrefabDunGen
    roomWhitelist:
      tags:
      - SalvageReactor
    presets:
    - ReactorBox
    - ReactorLong
    - ReactorStar
    - ReactorDouble

  - !type:CorridorDunGen
    width: 3
    tile: FloorDarkMono

  - !type:DungeonEntranceDunGen
    count: 3
    tile: FloorDarkMono
    contents: BaseAirlock
  
  - !type:ExternalWindowDunGen
    tile: FloorDarkMono
    contents: BaseWindow
  
  - !type:RoomEntranceDunGen
    tile: FloorDarkMono
    contents: BaseAirlock

  - !type:WallMountDunGen
    contents: ReactorWalls
    tile: FloorDarkMono

  - !type:BoundaryWallDunGen
    wall: WallReinforced
    tile: FloorDarkMono
  
  - !type:RoomEntranceDunGen
    tile: FloorDarkMono
    contents: BaseAirlock

  - !type:JunctionDunGen
    width: 3
    tile: FloorDarkMono
    contents: BaseAirlock

  - !type:AutoCablingDunGen
    entity: CableApcExtension
  
  - !type:CornerClutterDunGen
    contents: BaseClutter

  - !type:CorridorDecalSkirtingDunGen
    cardinalDecals:
      South: WarnLineN
      East: WarnLineE
      North: WarnLineW
      West: WarnLineS
    cornerDecals:
      SouthEast: WarnCornerSE
      SouthWest: WarnCornerSW
      NorthEast: WarnCornerNE
      NorthWest: WarnCornerNW
    pocketDecals:
      SouthWest: WarnCornerSmallSW
      SouthEast: WarnCornerSmallSE
      NorthWest: WarnCornerSmallNW
      NorthEast: WarnCornerSmallNE


