- type: entity
  parent: BaseGameRule
  id: XenomorphsInfestationRoundstart
  components:
  - type: GameRule
    chaosScore: 2500 # Goobstation - 1.5x blob
    minPlayers: 40 # Dumont
  - type: AntagObjectives
    objectives:
    - XenomorphSurviveObjective
    - XenomorphEstablishPylonObjective
    - XenomorphCorruptCommsObjective
  - type: XenomorphsRule # Goobstation - Required for Evolution Logic
    minTimeToAnnouncement: 900 # Dumont
    maxTimeToAnnouncement: 900 # Dumont
    sender: xenomorphs-announcement-sender
    xenomorphInfestationSound:
      path: /Audio/_Dumont/Eventos/Xenostation.ogg
      params: # Dumont
        volume: -4
  - type: MaintsSpawnRule # Dumont
    fallbackToVents: true
  - type: AntagSpawner
    prototype: MobXenomorphLarva
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    agentName: xenomorph-round-end-agent-name
    definitions:
    - prefRoles: [ XenomorphsInfestationRoundstart ]
      spawnerPrototype: SpawnPointGhostXenomorph
      min: 4 # Dumont
      max: 4
      pickPlayer: true
      mindRoles:
      - MindRoleXenomorph
      briefing:
        text: xenomorph-role-greeting
        color: "#8c3986"
