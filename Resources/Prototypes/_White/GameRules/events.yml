- type: entity
  parent: BaseGameRule
  id: XenomorphsInfestation
  components:
  - type: StationEvent
    weight: 3 #Dumont edit was 1.5
    duration: null
    minimumPlayers: 30 # Dumont edit was 50
    earliestStart: 30 # Goobstation
    #reoccurrenceDelay: 50 # Goobstation - no longer needed
    maxOccurrences: 1 # Goobstation
    chaos:
      Hostile: 400
      Medical: 400
      Death: 400
    eventType: HostilesSpawn
  - type: GameRule
    chaosScore: 600
  - type: VentSpawnRule
  - type: AntagSpawner
    prototype: MobXenomorphLarva
  - type: XenomorphsRule
    sender: xenomorphs-announcement-sender
    xenomorphInfestationSound:
      path: /Audio/_Dumont/Eventos/Xenostation.ogg
      params: # Dumont
        volume: -4
  - type: AntagObjectives
    objectives:
    - XenomorphSurviveObjective
    - XenomorphEstablishPylonObjective
    - XenomorphCorruptCommsObjective
  - type: AntagSelection
    agentName: xenomorph-round-end-agent-name
    definitions:
    - spawnerPrototype: SpawnPointGhostXenomorph
      min: 2
      max: 4
      pickPlayer: false
      briefing:
        text: xenomorph-role-greeting
        color: "#8c3986"
      mindRoles:
      - MindRoleXenomorph
