- type: entity
  name: makeshift SMG
  parent: [BaseWeaponSubMachineGun, BaseSalvageContraband]
  id: WeaponSubMachineGunMakeshift
  description: Held together with cloth and dreams, it rattles ominously with every shot.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/SMGs/improvised_smg.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/SMGs/improvised_smg.rsi
  - type: Item
    size: Normal  
  - type: Gun
    fireRate: 9
    minAngle: 32
    angleIncrease: 3
    maxAngle: 64
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/smg.ogg
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: null
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineSMGImprovised
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: null
        priority: 1
        whitelist:
          tags:
            - CartridgePistolImprovised

- type: entity
  name: improvised SMG
  parent: WeaponSubMachineGunMakeshift
  id: WeaponSubMachineGunImprovised
  description: It's tightly held together by cloth, steel and determination.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/SMGs/improvised_smg.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/SMGs/improvised_smg.rsi 
  - type: Item
    size: Large
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -5
    maxAngle: -10
  - type: Gun
    fireRate: 7
    minAngle: 16
    angleIncrease: 3
    maxAngle: 32
  - type: Appearance

- type: entity
  name: forged SMG
  parent: WeaponSubMachineGunImprovised
  id: WeaponSubMachineGunForged
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/SMGs/forged_smg.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/SMGs/forged_smg.rsi  
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -10
    maxAngle: -15
  - type: Gun
    fireRate: 5
    minAngle: 16
    angleIncrease: 3
    maxAngle: 32
  - type: Appearance

- type: entity
  id: MagazinePistolSubMachineGunImprovised
  name: Improvised 9mm Magazine (SMG)
  parent: [ BaseMagazinePistolSubMachineGun, BaseSalvageContraband ]
  components:
  - type: BallisticAmmoProvider
    proto: null
    capacity: 20
    whitelist:
      tags:
        - CartridgePistol
        - CartridgePistolImprovised
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Ammunition/Magazine/SMGs/improvised_smg_magazine.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
  - type: Tag
    tags:
      - MagazineSMGImprovised

- type: entity
  parent: BaseItem
  id: BaseMagazineBoxImprovised
  name: improvised ammunition box (.any)
  description: This looks suspiciously like a .20 magazine box with a crude bullet drawing ontop. Mixing ammo is not advised.
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgePistol
        - CartridgePistolImprovised
        - CartridgeMagnum
        - CartridgeMagnumImprovised
        - CartridgeLightRifle
        - CartridgeLightRifleImprovised
        - ShellShotgun
        - ShellShotgunImprovised
    proto: null
    capacity: 40
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Ammunition/Boxes/improvised.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance
  - type: Tag
    tags:
    - ImprovisedAmmoBox

- type: entity
  parent: BaseMagazineBoxImprovised
  id: MagazineBoxImprovisedPistol
  name: Improvised 9mm Ammunition Box
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistolImprovised
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - type: Construction
      graph: ImprovisedMagazineBoxGraph
      node: pistol

- type: entity
  id: CartridgePistolImprovised
  name: Improvised 9mm Cartridge
  description: A handmade pistol bullet, uses phosphorus as a propellent instead of gunpowder which makes it much less effective. 
  parent: [BaseCartridgePistol, BaseSalvageContraband]
  components:
  - type: CartridgeAmmo
    proto: BulletPistol
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Ammunition/Casings/improvised_casing.rsi
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#717171"
  - type: Tag
    tags:
      - Cartridge
      - CartridgePistolImprovised