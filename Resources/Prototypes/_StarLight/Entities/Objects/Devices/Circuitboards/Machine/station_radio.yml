- type: entity
  parent: BaseMachineCircuitboard
  id: CDPlayerCircuitboard
  name: radio CD player machine board
  description: A machine printed circuit board for a radio CD player.
  components:
  - type: Sprite
    state: service
  - type: MachineBoard
    prototype: CDPlayer
    stackRequirements:
      Manipulator: 1
      Steel: 2
      Glass: 1

- type: entity
  parent: BaseMachineCircuitboard
  id: StationRadioMixerCircuitboard
  name: radio mixer machine board
  description: A machine printed circuit board for a radio mixer.
  components:
  - type: Sprite
    state: service
  - type: MachineBoard
    prototype: StationRadioMixer
    stackRequirements:
      Manipulator: 2
      Steel: 2
      Cable: 2

- type: entity
  parent: BaseMachineCircuitboard
  id: BroadcastRecorderCircuitboard
  name: radio recorder machine board
  description: A machine printed circuit board for a radio recorder.
  components:
  - type: Sprite
    state: service
  - type: MachineBoard
    prototype: BroadcastRecorder
    stackRequirements:
      Manipulator: 2
      Steel: 2
      Glass: 1
