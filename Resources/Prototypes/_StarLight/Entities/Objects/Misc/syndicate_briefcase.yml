- type: entity
  parent: [BriefcaseSyndie, BaseMinorContraband]
  id: BriefcaseSyndicateRedspace
  name: syndicate briefcase
  suffix: Empty, Digital Lock
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Storage/Briefcases/syndicate_briefcase.rsi
    state: icon
  - type: Item
    sprite: _Starlight/Objects/Storage/Briefcases/syndicate_briefcase.rsi
  - type: DigitalLock
  - type: Lock
    unlockOnClick: false
    useAccess: false
    showLockVerbs: false
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.DigitalLockUiKey.Key:
        type: DigitalLockBoundUserInterface
  - type: ActivatableUI
    key: enum.DigitalLockUiKey.Key
  - type: AmbientSound
    enabled: false
    range: 20
    sound:
      collection: sparks
