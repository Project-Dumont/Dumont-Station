#Spationaut Lead Hardsuit
- type: entity
  parent: [ClothingOuterHardsuitBase, BaseSalvageContraband]
  id: ClothingOuterHardsuitSpatioLead
  name: spationaut lead hardsuit
  description: A lightweight decorated hardsuit designed for industrial EVA in zero gravity.
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/OuterClothing/Hardsuits/leadspatio.rsi
    - type: Clothing
      sprite: _Starlight/Clothing/OuterClothing/Hardsuits/leadspatio.rsi
    - type: PressureProtection
      highPressureMultiplier: 0.7
      lowPressureMultiplier: 1000
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.9
          Slash: 0.9
          Piercing: 0.9
          Radiation: 0.3 #salv is supposed to have radiation hazards in the future
          Caustic: 0.8
    - type: ClothingSpeedModifier
      walkModifier: 0.8
      sprintModifier: 0.8
    - type: HeldSpeedModifier
    - type: ToggleableClothing
      clothingPrototype: ClothingHeadHelmetHardsuitSpatioLead
    - type: Tag
      tags:
        - Hardsuit
        - HardsuitSpatio