# Air Sensor

- type: entity
  abstract: true
  id: AirSensorColdWeatherBase
  suffix: ColdWeather
  components:
  - type: AtmosMonitor
    temperatureThresholdId: stationTemperatureColdWeather # tuned for cold atmospheres / winter clothing
    pressureThresholdId: stationPressureColdWeather # cold air is surprisingly breathable (dense)

- type: entity
  parent: [AirSensorColdWeatherBase, AirSensor]
  id: AirSensorColdWeather

# Air Alarm

- type: entity
  parent: AirAlarm
  id: AirAlarmColdWeather
  name: air alarm
  description: An air alarm set up for use in cold weather. It tolerates freezing temperatures and low pressure.
  suffix: ColdWeather

# Gas Vent

- type: entity
  abstract: true
  id: GasVentPumpColdWeatherBase
  suffix: ColdWeather
  components:
  - type: AtmosPipeLayers
    alternativePrototypes:
      Primary: GasVentPumpColdWeather
      Secondary: GasVentPumpColdWeatherAlt1
      Tertiary: GasVentPumpColdWeatherAlt2
      Quaternary: GasVentPumpColdWeatherAlt3
      Quinary: GasVentPumpColdWeatherAlt4

- type: entity
  parent: [AirSensorColdWeatherBase, GasVentPumpColdWeatherBase, GasVentPump]
  id: GasVentPumpColdWeather

- type: entity
  parent: [AirSensorColdWeatherBase, GasVentPumpColdWeatherBase, GasVentPumpAlt1]
  id: GasVentPumpColdWeatherAlt1
  categories: [ HideSpawnMenu ]

