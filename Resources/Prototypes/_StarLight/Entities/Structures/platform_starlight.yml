# Starlight platform variants: Dark and Wood
# These inherit the physics, fixtures, climbable behavior, and placement
# from the existing RMC14 platform prototypes above.

- type: entity
  parent: CMPlatform
  id: CMPlatformDark
  suffix: Dark
  components:
  - type: Sprite
    sprite: _Starlight/Structures/platforms.rsi
    state: platform_dark
    drawdepth: HighFloorObjects
  - type: ChildEntities
    childPrototypes:
      - prototype: OverlayCMPlatformDark

- type: entity
  parent: CMPlatformCorner
  id: CMPlatformCornerDark
  suffix: Dark, Corner
  components:
  - type: Sprite
    sprite: _Starlight/Structures/platforms.rsi
    state: platform_corner_dark
    drawdepth: HighFloorObjects
  - type: ChildEntities
    childPrototypes:
      - prototype: OverlayCMPlatformCornerDark

