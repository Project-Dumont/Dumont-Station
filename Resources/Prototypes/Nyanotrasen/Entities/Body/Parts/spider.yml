- type: entity
  id: PartSpider
  parent: BaseItem
  name: "spider body part"
  abstract: true
  components:
  - type: Damageable
    damageContainer: OrganicPart
  - type: BodyPart
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice
    price: 100
  - type: Tag
    tags:
      - Trash
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: DemonsBlood
        Quantity: 10

- type: entity
  id: GroinSpider
  name: "spider Groin" #for arachne, actual spiders should get a cephalothorax that combines with head.
  parent: [PartSpider, BaseGroin]
  components:
  - type: Sprite
    sprite: Mobs/Species/Moth/parts.rsi # placeholder sprite
    state: "chest_m"
  - type: Icon
    sprite: Mobs/Species/Moth/parts.rsi
    state: "chest_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: DemonsBlood
        Quantity: 20

- type: entity
  id: RightLegSpider
  name: "right spider leg"
  parent: [PartSpider, BaseRightLeg]
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/meat.rsi # placeholder sprite
    state: spiderleg
  - type: Icon
    sprite: Objects/Consumable/Food/meat.rsi
    state: spiderleg
  - type: BodyPart
    partType: Leg
    symmetry: Right

- type: entity
  id: LeftLegSpider
  name: "left spider leg"
  parent: [PartSpider,BaseLeftLeg]
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/meat.rsi # placeholder sprite
    state: spiderleg
  - type: Icon
    sprite: Objects/Consumable/Food/meat.rsi
    state: spiderleg
  - type: BodyPart
    partType: Leg
    symmetry: Left
