# Note: This file exists in the root Resources to ensure the server content pack
# loads the viewport pack prototype used by the store listing.

# Bundle: Viewport actions (Set + Open)
# Place viewport action
- type: entity
  id: ActionMalfAiSetViewport
  name: malfai-viewport-place-name
  description: malfai-viewport-place-desc
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -5
    useDelay: 30
    icon: { sprite: Interface/Actions/actions_malf_ai.rsi, state: malfai_bg_placeviewport }
  - type: TargetAction
    checkCanAccess: false
    range: 99999
  - type: WorldTargetAction
    event: !type:MalfAiSetViewportActionEvent

# Open viewport action
- type: entity
  id: ActionMalfAiOpenViewport
  name: malfai-viewport-open-name
  description: malfai-viewport-open-desc
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -5
    icon: { sprite: Interface/Actions/actions_malf_ai.rsi, state: malfai_bg_openviewport }
  - type: InstantAction
    event: !type:MalfAiOpenViewportActionEvent


