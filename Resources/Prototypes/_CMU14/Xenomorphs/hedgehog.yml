- type: entity
  id: DumontXenomorphSpike
  name: bone chips
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Materials/shards.rsi
    noRot: false
    layers:
    - state: bonechips
      shader: unshaded
  - type: Physics
    bodyType: Dynamic
    bodyStatus: InAir
    linearDamping: 0
    angularDamping: 0
  - type: Fixtures
    fixtures:
      projectile:
        shape: !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        hard: false
        mask: [Impassable, BulletImpassable]
  - type: Projectile
    impactEffect: null
    damage:
      types:
        Slash: 8
  - type: XenomorphShardProjectile
  - type: TimedDespawn
    lifetime: 1

- type: entity
  parent: DumontXenomorphSpike
  id: DumontXenomorphSpikeShort
  components:
  - type: XenomorphShardProjectile
    range: 2

- type: entity
  id: DumontXenomorphSpikeShieldEffect
  categories: [HideSpawnMenu]
  components:
  - type: Appearance
  - type: XenomorphSpikeShieldVisual
  - type: Sprite
    sprite: _RMC14/Effects/xeno_shields.rsi
    state: hedgehog-shield-full
    noRot: true
    drawdepth: Effects
