- type: entity
  id: DumontXenomorphWallWeeds
  name: wall resin
  description: Thick resin clinging to the wall.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_weeds.rsi
    state: weedwall
    drawdepth: Overdoors
    noRot: true
  - type: XenomorphWallResinOverlay
  - type: Clickable
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Resin
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:DoActsBehavior
        acts: [Destruction]

- type: entity
  parent: ResinNest
  id: DumontXenomorphWallNest
  name: wall nest
  description: A thick resin cocoon attached to the wall.
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_weeds.rsi
    state: nest_overlay
    drawdepth: Overdoors
    noRot: false
  - type: Icon
    sprite: _RMC14/Structures/Xenos/xeno_weeds.rsi
    state: nest_overlay
  - type: WallMount
    arc: 360
  - type: Strap
    position: Stand
    modifyBuckleDrawDepth: false

- type: entity
  parent: DumontXenomorphDesignResidue
  id: DumontXenomorphFastResin
  name: fast resin
  components:
  - type: XenomorphResinFloor
  - type: Sprite
    state: fast
  - type: SpeedModifierContacts
    walkSpeedModifier: 1.33
    sprintSpeedModifier: 1.33
    ignoreWhitelist: null
    whitelist:
      components: [Xenomorph]

- type: entity
  parent: DumontXenomorphFastResin
  id: DumontXenomorphResinSpikes
  name: resin spikes
  components:
  - type: XenomorphResinSpikes
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_resin_spikes.rsi
    state: resin_spike
  - type: SpeedModifierContacts
    walkSpeedModifier: 1
    sprintSpeedModifier: 1

- type: entity
  parent: ResinMembrane
  id: DumontXenomorphResinMembraneThick
  name: thick resin membrane
  components:
  - type: XenomorphThickResin
  - type: Icon
    state: thickmembrane
  - type: IconSmooth
    base: thickmembrane
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTypeTrigger
        damageType: Blunt
        damage: 142
      behaviors:
      - !type:DoActsBehavior
        acts: [Destruction]
    - trigger: !type:DamageTypeTrigger
        damageType: Heat
        damage: 97
      behaviors:
      - !type:DoActsBehavior
        acts: [Destruction]
