- type: entity
  parent: BaseItem
  id: DumontXenomorphFruitLesser
  name: lesser resin fruit
  description: A strange greenish fruit growing from alien resin.
  components:
  - type: XenomorphFruit
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_fruit.rsi
    noRot: true
    drawdepth: SmallMobs
    layers:
    - state: fruit_lesser_immature
      map: [enum.XenomorphFruitVisuals.Base]
  - type: Tag
    tags: [XenomorphItem]
  - type: Item
    size: Large
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.XenomorphFruitVisuals.State:
        enum.XenomorphFruitVisuals.Base:
          Growing: { state: fruit_lesser_immature }
          Grown: { state: fruit_lesser }
          Item: { state: fruit_lesser_item }
          Eaten: { state: fruit_lesser_spent }
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: [Destruction]
    - trigger: !type:DamageTypeTrigger
        damageType: Heat
        damage: 60
      behaviors:
      - !type:DoActsBehavior
        acts: [Destruction]
  - type: Flammable
    fireSpread: false
    damage:
      types:
        Heat: 3
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask: [ItemMask]
        restitution: 0.3
        friction: 0.2

