- type: entity
  id: BaseDumontHiveStructure
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Appearance
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        layer: [BulletImpassable]
        density: 200
  - type: InteractionOutline
  - type: Clickable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Resin
  - type: NpcFactionMember
    factions: [Xeno]
  - type: Flammable
    fireSpread: false
    maximumFireStacks: 0.5
    damage:
      types:
        Heat: 3.8

- type: entity
  id: DumontHiveEggMorpherChildRole
  categories: [HideSpawnMenu]
  components:
  - type: XenomorphEggMorpherChildRole
  - type: GhostRole
    name: ghost-role-information-facehugger-name
    description: ghost-role-information-facehugger-description
    rules: ghost-role-information-rules-default-xeno
    makeSentient: true
    allowMovement: true
    allowSpeech: true
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist


- type: entity
  parent: BaseDumontHiveStructure
  id: DumontHiveAcidPillar
  name: acid pillar
  description: A tall pillar that is capable of firing weak acid.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_acid_pillar.rsi
    state: idle
    noRot: true
  - type: XenomorphAcidPillar
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [Destruction]

