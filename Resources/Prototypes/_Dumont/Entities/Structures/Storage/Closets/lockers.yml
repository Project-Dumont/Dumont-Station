- type: entity
  id: LockerCoroner
  parent: LockerBase
  name: coroner's locker
  description: Smells of formaldehyde and paperwork.
  components:
  - type: Sprite
    sprite: _Dumont/Structures/Storage/Closets/coroner.rsi
    noRot: true
    layers:
    - state: generic
      map: ["enum.StorageVisualLayers.Base"]
    - state: generic_door
      map: ["enum.StorageVisualLayers.Door"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
      offset: "-0.0625,0.09375"
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      offset: "-0.065,0"
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: generic
    stateDoorOpen: generic_open
    stateDoorClosed: generic_door
  - type: AccessReader
    access: [ [ "Medical" ] ]

- type: entity
  parent: LockerCoroner
  id: LockerCoronerFilled
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ScalpelAutopsy
        - id: ClothingUniformJumpsuitCoroner
        - id: ClothingHeadHatCoroner
        - id: ClothingOuterCoatLab
        - id: ClothingHandsGlovesLatex
        - id: ClothingMaskSterile
        - id: BodyBagFolded
        - id: BodyBagFolded
