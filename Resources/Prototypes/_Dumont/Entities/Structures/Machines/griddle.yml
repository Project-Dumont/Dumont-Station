- type: entity
  parent: BaseHeaterMachine
  id: KitchenGriddle
  name: griddle
  description: A microwave? No, a real man cooks steaks on a grill!
  components:
  - type: Sprite
    # TODO: draw a sprite
    sprite: _Dumont/Structures/Machines/griddle.rsi
    drawdepth: SmallObjects
    snapCardinals: true
    layers:
    - state: icon
    - map: ["enum.EntityHeaterVisuals.Setting"]
      visible: false
    - map: ["griddleGlow"]
      state: unshaded
      shader: unshaded
      visible: false
  - type: ApcPowerReceiver
    powerLoad: 0
  - type: EntityHeater
    settingSound:
      path: /Audio/Weapons/click.ogg
      params:
        volume: -6
  - type: ItemPlacer
    maxEntities: 6 # big grill, many steaks
    whitelist:
      components:
      - Temperature
  - type: PlaceableSurface
  - type: Machine
    board: ElectricGrillMachineCircuitboard
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.EntityHeaterVisuals.Setting:
        enum.EntityHeaterVisuals.Setting:
          Off: { visible: false }
          Low: { visible: true, state: low }
          Medium: { visible: true, state: medium }
          High: { visible: true, state: high }
        griddleGlow:
          Off: { visible: false }
          Low: { visible: true }
          Medium: { visible: true }
          High: { visible: true }
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage"]
  - type: GuideHelp
    guides:
    - Chef
  - type: Fixtures
    fixtures:
      griddleBody:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.40,-0.40,0.40,0.40"
        density: 190
        mask: []
        layer:
        - MachineLayer
      griddleSensor:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        hard: false
        mask: []
        layer:
        - HighImpassable