- type: entity
  parent: BaseWallmountMachine
  id: WallmountPodConsole
  name: escape pod console
  description: A terminal that controls the escape pod. The controls have been locked down to prevent you from launching the pod early, though.
  suffix: Wall
  components:
    - type: PodConsole
    - type: WallMount
      arc: 360
    - type: ApcPowerReceiver
      powerLoad: 200
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.PowerDeviceVisuals.Powered:
          enum.PowerDeviceVisualLayers.Powered:
            True: { visible: true }
            False: { visible: false }
    - type: Sprite
      sprite: _Dumont/Structures/Wallmounts/pod_console.rsi
      layers:
      - state: base
      - state: unshaded
        shader: unshaded
        map: [ "enum.PowerDeviceVisualLayers.Powered" ]
        visible: false
    - type: Destructible
      thresholds:
      - trigger: # Excess damage, don't spawn entities
          !type:DamageTrigger
          damage: 200
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            collection: GlassBreak
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            collection: GlassBreak
        - !type:DoActsBehavior
          acts: [ "Destruction" ]