# ideia original do SukitaBR na issue #894
# junta o t-ray e o meson num item só, com 2 tiles a mais de alcance em cada
# modo pra compensar o custo de fabricação

- type: entity
  parent: [ClothingEyesBase, BaseToggleClothing]
  id: ClothingEyesGlassesEngineeringScanner
  name: engineering scanner goggles
  description: Combined scanning goggles. Reveals the station layout and the engineering equipment through walls at once, without occupying your hands.
  components:
  - type: Sprite
    sprite: Clothing/Eyes/Glasses/meson.rsi
  - type: Clothing
    sprite: Clothing/Eyes/Glasses/meson.rsi
  # sem EyeProtection: proteger de solda não é o propósito desses óculos
  # o TrayScanner tira o equipamento de baixo do piso e o ScannerVision traz ele
  # pra frente através das paredes.. um sem o outro não resolve
  - type: TrayScanner
    enabled: false
    range: 6
  - type: WornTrayScanner
  - type: ScannerVision
    showsStructure: true
    range: 6
  # a planta da estação, o modo do meson
  - type: MesonVision
    range: 10
  - type: ItemToggle
    onActivate: false # é roupa, não liga clicando na mão
  - type: ToggleClothing
    action: ActionToggleEngineeringScanner
    mustEquip: true
    disableOnUnequip: true
  - type: IdentityBlocker
    coverage: EYES
  - type: PhysicalComposition
    materialComposition:
      Steel: 500
      Glass: 300
      Gold: 100
  - type: StaticPrice
    price: 500
  - type: Tag
    tags:
    - WhitelistChameleon

- type: entity
  parent: BaseAction
  id: ActionToggleEngineeringScanner
  name: Toggle scanner goggles
  description: Turns the combined scanner on and off.
  components:
  - type: Action
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ToggleActionEvent
