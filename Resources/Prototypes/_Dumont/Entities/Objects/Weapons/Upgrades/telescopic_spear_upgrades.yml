- type: entity
  id: BaseSpearTelescopicUpgrade
  parent: [BaseItem, BaseSecurityContraband]
  name: telescopic spear upgrade
  description: A modkit for a Telescopic Spear.
  abstract: true
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Weapons/upgrade.rsi
  - type: Item
    size: Small
  - type: GunUpgrade
  - type: StaticPrice
    price: 75
  - type: Tag
    tags:
    - SpearTelescopicUpgradeMain

- type: entity
  id: SpearTelescopicUpgradeAttackSpeed
  parent: BaseSpearTelescopicUpgrade
  name: telescopic spear handle upgrade (attack speed)
  description: A lightweight handle replacement for the telescopic spear that allows you to make attacks more frequently.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ffc222"
    - state: overlay-2
      color: "#7f00ff"
    - state: overlay-3
      color: "#ba8e23"
  - type: GunUpgrade
    name: gun-upgrade-attack-speed
  - type: WeaponUpgradeSpeed
    attackRateMultiplier: 1.3 # 30% faster

- type: entity
  id: SpearTelescopicUpgradeMeleeRange
  parent: BaseSpearTelescopicUpgrade
  name: telescopic spear handle upgrade (melee range)
  description: An upgrade that increases the length of the spear's handle and consequently increases the melee range of the weapon.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#f96c1b"
    - state: overlay-2
      color: "#7f00ff"
    - state: overlay-3
      color: "#e65100"
  - type: GunUpgrade
    name: gun-upgrade-melee-range
  - type: WeaponUpgradeRange
    rangeMultiplier: 1.20 # 20% more range