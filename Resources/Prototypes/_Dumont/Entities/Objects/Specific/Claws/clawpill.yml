    pillType: 18
  - type: Sprite
    state: pill18
  - type: Label
    currentLabel: meroxzine 5u
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Meroxzine
          Quantity: 5