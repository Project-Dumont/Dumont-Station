- type: entity
  parent: [BaseTraitorObjective, BaseKillObjective]
  id: KillStationAiObjective
  description: Nanotrasen proudly boasts about its state of the art artificial intelligence. Remind it that this is just another toy that can be broken.
  components:
  - type: Objective
    difficulty: 3
    unique: true
    icon:
      sprite: Mobs/Silicon/station_ai.rsi
      state: ai_dead
  - type: TargetObjective
    title: objective-condition-kill-station-ai
  - type: PickRandomPerson
    pool: !type:AliveAiPool
    filters:
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
  - type: KillPersonCondition
    requireDead: true
