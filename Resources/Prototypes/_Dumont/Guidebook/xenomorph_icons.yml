# Sprite-only references for the guidebook; these do not grant abilities.
- type: entity
  id: BaseXenomorphGuideIcon
  abstract: true
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    noRot: true

- type: entity
  parent: BaseXenomorphGuideIcon
  id: XenomorphGuideEvolution
  name: Evoluir
  components:
