- type: entity
  name: Dahlia
  suffix: Admeme
  parent: [BaseWeaponPistol, BaseMajorContraband]
  id: WeaponPistolDahlia
  description: A beautiful, custom-made handcannon refined for maximum lethality and precision. Sister to the Chrysanthemum.
  components:
  - type: Sprite
    sprite: _Dumont/Admeme/Objects/Weapons/Guns/dahlia.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Dumont/Admeme/Objects/Weapons/Guns/dahlia.rsi
  - type: Gun
    minAngle: 1
    maxAngle: 3
    angleIncrease: 1
    angleDecay: 4
    fireRate: 2
    burstFireRate: 9
    availableModes:
    - SemiAuto
    - Burst
    shotsPerBurst: 3
    burstCooldown: 1.25
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
  - type: SpeciesRestrictedTrigger
    enabled: false
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineMagnumHighCapacity
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineMagnum
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeMagnum
        priority: 1
        whitelist:
          tags:
            - CartridgeMagnum
  - type: Tag
    tags:
    - WeaponPistolDahlia
  - type: Multishot
    missChance: 0
    spreadMultiplier: 1
    spreadAddition: 0
  - type: RequiresDualWield
    whitelist:
      tags:
      - WeaponPistolChrysanthemum

