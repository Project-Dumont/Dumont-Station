# Revolvers

- type: entity
  name: The Silverthorn
  suffix: admeme
  parent: [BaseWeaponRevolver, BaseMajorContraband]
  id: WeaponRevolverSilverthorn
  description: This single-action revolver is a nefarious masterpiece, anti-materiel firepower that fits into your hand, loads five .60 rounds. 
  components:
  - type: Sprite
    sprite: _Dumont/Admeme/Objects/Weapons/Guns/nefarious_revolver.rsi
  - type: Clothing
    sprite: _Dumont/Admeme/Objects/Weapons/Guns/nefarious_revolver.rsi
  - type: Gun
    fireRate: 0.65 
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/sniper.ogg
  - type: RevolverAmmoProvider
    whitelist:
      tags:
        - CartridgeAntiMateriel
    proto: CartridgeAntiMateriel
    capacity: 5
    chambers: [ True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null ]
    soundEject:
      path: /Audio/Weapons/Guns/MagOut/revolver_magout.ogg
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/revolver_magin.ogg
  - type: SpeciesRestrictedTrigger
    enabled: false
