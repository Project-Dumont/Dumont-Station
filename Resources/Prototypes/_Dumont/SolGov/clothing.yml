- type: entity
  parent: [ ClothingOuterArmorHelldiver, BaseSolGovContraband ]
  id: ClothingOuterArmorSolGov
  name: SolGov tactical hardsuit
  description: Standard issue armor of the Sol Government Expeditionary Force, sealed against the void.
  components:
  - type: Contraband
    severity: SolGov
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    traumaDeductions:
      Dismemberment: 0.8
      OrganDamage: 0.8
      BoneDamage: 0.8
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.2
        Slash: 0.2
        Piercing: 0.2
        Heat: 0.2
        Cold: 0.2
        Shock: 0.2
        Caustic: 0.2
        Radiation: 0.2
  - type: ExplosionResistance
    damageCoefficient: 0.2
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.01
    coolingCoefficient: 0.01

- type: entity
  parent: [ ClothingHeadHelmetHelldiver, BaseSolGovContraband ]
  id: ClothingHeadHelmetSolGov
  name: SolGov tactical helmet
  description: Standard issue helmet of the Sol Government Expeditionary Force, sealed against the void.
  components:
  - type: Contraband
    severity: SolGov
  - type: Armor
    coverage:
    - Head
    traumaDeductions:
      Dismemberment: 0.8
      OrganDamage: 0.8
      BoneDamage: 0.8
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.2
        Slash: 0.2
        Piercing: 0.2
        Heat: 0.2
        Cold: 0.2
        Shock: 0.2
        Caustic: 0.2
        Radiation: 0.2
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.01
    coolingCoefficient: 0.01

- type: entity
  parent: [ ClothingNeckCloakHelldiver, BaseSolGovContraband ]
  id: ClothingNeckCloakSolGov
  name: SolGov loyalty cape
  description: Worn by those who swore to defend the Trans-Solar Federation.

- type: entity
  parent: [ ClothingEyesGlassesMercenary, ShowSecurityIcons, BaseSolGovContraband ]
  id: ClothingEyesGlassesSolGov
  name: SolGov tactical glasses
  description: Combat glasses of the Sol Government Expeditionary Force, with a security display and night vision.
  components:
  - type: NightVision
    isEquipment: true

- type: entity
  parent: [ ClothingBackpackERTChaplain, BaseSolGovContraband ]
  id: ClothingBackpackSol
  name: SolGov MOLLE pack
  description: A combat backpack issued to the Sol Government Expeditionary Force.
  components:
  - type: Contraband
    severity: SolGov

- type: entity
  parent: [ ClothingBeltMercWebbing, BaseSolGovContraband ]
  id: ClothingBeltMercWebbingSolGovFilled
  name: SolGov webbing
  suffix: SolGov, Filled
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: SolGovBeltFillTable

- type: entityTable
  id: SolGovBeltFillTable
  table: !type:AllSelector
    children:
    - id: MagazineSMGP90
      amount: !type:ConstantNumberSelector
        value: 5
    - id: ClusterBangFull
      amount: !type:ConstantNumberSelector
        value: 2
