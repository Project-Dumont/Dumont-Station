## Mob

- type: entity
  id: AppearanceShattered
  name: Shattered appearance
  components:
  - type: HumanoidAppearance
    species: Shattered
  - type: Body
    prototype: Shattered
    requiredLegs: 2
  - type: Inventory
    templateId: human
  - type: InventorySlots
  - type: ContainerContainer
  - type: Appearance
  - type: Hands
  - type: ComplexInteraction
  - type: Sprite
    layers:
    - map: [ "enum.HumanoidVisualLayers.Groin" ]
    - map: [ "enum.HumanoidVisualLayers.Chest" ]
    - map: [ "enum.HumanoidVisualLayers.Head" ]
    - map: [ "enum.HumanoidVisualLayers.Snout" ]
    - map: [ "enum.HumanoidVisualLayers.Eyes" ]
    - map: [ "enum.HumanoidVisualLayers.RArm" ]
    - map: [ "enum.HumanoidVisualLayers.LArm" ]
    - map: [ "enum.HumanoidVisualLayers.RLeg" ]
    - map: [ "enum.HumanoidVisualLayers.LLeg" ]
    - map: [ "enum.HumanoidVisualLayers.Underwear" ] # Goob 3370
    - map: [ "enum.HumanoidVisualLayers.Undershirt" ] # Goob 3370
    - map: ["jumpsuit"]
    - map: ["enum.HumanoidVisualLayers.LFoot"]
    - map: ["enum.HumanoidVisualLayers.RFoot"]
    - map: ["enum.HumanoidVisualLayers.LHand"]
    - map: ["enum.HumanoidVisualLayers.RHand"]
    - map: ["enum.HumanoidVisualLayers.Face"] #Goob 120 - why did we have face on dummy but not basespecies
    - map: [ "gloves" ]
    - map: [ "shoes" ]
    - map: [ "ears" ]
    - map: [ "outerClothing" ]
    - map: [ "belt" ] #Goobedit - Belts over outerwear
    - map: [ "culteyes" ] # funky cult
      sprite: "_Funkystation/BloodCult/Effects/culteyes.rsi"
      state: "human"
      shader: unshaded
      visible: false
    - map: [ "eyes" ]
    - map: [ "id" ]
    - map: [ "back" ]
    - map: [ "neck" ]
    - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
    - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
    - map: [ "maskalt" ]
    - map: [ "enum.HumanoidVisualLayers.Hair" ]
    - map: [ "mask" ]
    - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
    - map: [ "enum.HumanoidVisualLayers.Tail" ]
    - map: [ "enum.HumanoidVisualLayers.Wings" ] # For IPC wings porting from SimpleStation
    - map: [ "head" ]
    - map: [ "pocket1" ]
    - map: [ "pocket2" ]
    - map: ["enum.HumanoidVisualLayers.Handcuffs"]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
    - map: [ "clownedon" ] # Dynamically generated
      sprite: "Effects/creampie.rsi"
      state: "creampie_human"
      visible: false
    - map: [ "culthalo" ] # funky cult
      sprite: "_Funkystation/BloodCult/Effects/halo.rsi"
      state: "halo"
      shader: unshaded
      visible: false

- type: entity
  save: false
  name: Urist McShattered
  parent:
  - AppearanceShattered
  - BaseMob
  - MobDamageable
  - MobPolymorphable
  - MobCombat
  - MobAtmosStandard
  - MobFlammable
  - MobNightVision
  id: MobShattered
  components:
  - type: Icon
    sprite: _Goobstation/Heretic/abilities_heretic.rsi
    state: ghoul_shattered
  - type: FootprintOwner
  - type: StunVisuals
  - type: FireVisuals
    alternateState: Standing
  - type: Damageable
    damageContainer: Biological
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
  - type: MeleeWeapon # In case they lose all their hands I guess
    soundHit:
      collection: GlassBreak
    animation: WeaponArcSmash
    damage:
      types:
        Slash: 8
        Piercing: 7
  - type: PassiveDamage
    splitBehavior: SplitEnsureAll
    allowedStates:
    - Alive
    damage:
      types:
        Blunt: -2
        Slash: -2
        Piercing: -2
        Ballistic: -2
        Heat: -2
        Cold: -2
        Shock: -2
        Asphyxiation: -2
        Bloodloss: -2
        Caustic: -2
        Poison: -2
        Radiation: -2
        Cellular: -2
        Holy: -2
  - type: Targeting
  - type: PermanentStatusEffects
    statusEffects:
    - StatusEffectPressureImmunity
  - type: ZombieImmune
  - type: MobThresholds
    thresholds:
      0: Alive
      250: Critical
      260: Dead
  - type: ShatteredRisen
  - type: StatusIcon
    bounds: -0.5,-0.5,0.5,0.5
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: Fixtures
    fixtures: # TODO: This needs a second fixture just for mob collisions.
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 220
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: FloorOcclusion
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          GlassBreak
    soundTypes:
      Heat:
        collection:
          MeatLaserImpact
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
      Acidic: [Touch, Ingestion, Eyes]
    reactions:
    - reagents: [Water, SpaceCleaner]
      methods: [Touch]
      effects:
      - !type:WashCreamPie
  - type: StatusEffects
    allowed:
    - Stun
    - KnockedDown
    - SlowedDown
    - Stutter
    - Electrocution
    - Drunk
    - SlurredSpeech
    - RatvarianLanguage
    - Pacified
    - StaminaModifier
  - type: Identity
  - type: IdExaminable
  - type: Hands
  - type: ComplexInteraction
  - type: FloatingVisuals
  - type: Climbing
  - type: Ensnareable
    sprite: Objects/Misc/ensnare.rsi
    state: icon
  - type: AnimationPlayer
  - type: Buckle
  - type: CombatMode
    canDisarm: true
  - type: SSDIndicator
  - type: StandingState
  - type: MindContainer
  - type: NpcFactionMember
    factions:
    - Heretic
  - type: CreamPied
    sprite:
      sprite: Effects/creampie.rsi
      state: creampie_human
  - type: UserInterface
    interfaces:
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: StepTriggerImmune
    whitelist:
      types:
      - Shard
  - type: Puller
    needsHands: false
  - type: Speech
    speechSounds: null
  - type: DamageForceSay
  - type: Vocal
    emoteSounds: MaleHuman
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    understands:
    - TauCetiBasic
  - type: Emoting
  - type: BodyEmotes
    soundsId: GeneralBodyEmotes
  - type: Grammar
    attributes:
      proper: true
  - type: MobPrice
    price: 3000
    deathPenalty: 0.01
  - type: Crawler
  - type: CanEscapeInventory
  - type: Penetratable
    penetrateDamage: 50
    damagePenalty: 0.2
  - type: ExaminableCharacter
  - type: Stamina
    critThreshold: 300
    animationThreshold: 150
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Effects/glass_step.ogg
      params:
        variation: 0.09
        volume: -8
  - type: Insulated
  - type: FlashImmunity
    showInExamine: false
  - type: FlashSoundSuppression
    protectionRange: 0
  - type: CollectiveMind
    defaultChannel: MansusLink
    channels:
    - MansusLink
  - type: NoSlip

## Base

- type: entity
  abstract: true
  parent: [ BaseItem, BasePart ]
  id: OrganShattered
  suffix: Shattered

- type: entity
  abstract: true
  parent: OrganShattered
  id: OrganShatteredExternal
  components:
  - type: Sprite
    sprite: _Goobstation/Heretic/Mobs/Shattered/parts.rsi
  - type: BodyPart
    species: Shattered
  - type: Woundable
    canBleed: false
  - type: WoundableVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Shitmed/Mobs/Effects/brute_damage.rsi
        color: "#000000"
    bleedingOverlay: null

