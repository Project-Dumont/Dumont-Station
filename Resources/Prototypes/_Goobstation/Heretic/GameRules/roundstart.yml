- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseHereticRule
  components:
  - type: HereticRule
  - type: GameRule
    minPlayers: 15
  - type: AntagObjectives
    objectives:
    - HereticKnowledgeObjective
    - HereticSacrificeObjective
    - HereticSacrificeHeadObjective
  - type: AntagSelection
    agentName: heretic-roundend-name

- type: entity
  parent: BaseHereticRule
  id: HereticRoundstart
  components:
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Heretic ]
      min: 1
      max: 6
      playerRatio: 10
      chaosScore: 120
      lateJoinAdditional: true
      jobBlacklist: [ Chaplain ]
      blacklist:
        components:
        - CommandStaff
      mindRoles:
      - MindRoleHeretic
  - type: Tag
    tags:
    - RoundstartAntag

- type: entity
  parent: HereticRoundstart
  id: Heretic

- type: entity
  parent: HereticRoundstart
  id: CalmHeretic
  components:
  - type: AntagSelection
    definitions:
    - prefRoles: [ Heretic ]
      min: 1
      max: 2
      playerRatio: 20
      lateJoinAdditional: true
      jobBlacklist: [ Chaplain ]
      blacklist:
        components:
        - CommandStaff
      mindRoles:
      - MindRoleHeretic
  - type: Tag
    tags:
    - CalmAntag
