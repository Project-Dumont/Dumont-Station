- type: entity
  parent: BaseAction
  id: ActionHereticVoidPhase
  name: Void Phase
  description: Lets you blink to your pointed destination, causes 3x3 aoe damage bubble around your pointed destination and your current location.
  components:
  - type: Action
    icon: { sprite: _Goobstation/Heretic/abilities_heretic.rsi, state: void_phase }
    checkCanInteract: false
    useDelay: 20
    itemIconStyle: NoItem
    sound: !type:SoundPathSpecifier
      path: /Audio/_Goobstation/Heretic/voidblink.ogg
  - type: TargetAction
    checkCanAccess: false
    range: 16
  - type: WorldTargetAction
    event: !type:HereticVoidBlinkEvent
  - type: HereticAction
    requireMagicItem: true
  - type: SpeakOnAction
    sentence: heretic-speech-void-phase
  - type: ChangeUseDelayOnAscension
    newUseDelay: 10
    requiredPath: Void

- type: entity
  parent: BaseAction
  id: ActionHereticVoidPrison
  name: Void Prison
  description: Sends a heathen into the void for 10 seconds. They will be unable to perform any actions for the duration. Afterwards, they will be chilled and returned to the mortal plane.
  components:
  - type: Action
    icon: { sprite: _Goobstation/Heretic/abilities_heretic.rsi, state: voidball }
    predicted: false
    checkCanInteract: false
    useDelay: 30
    itemIconStyle: NoItem
  - type: TargetAction
    range: 3
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:HereticVoidPrisonEvent
  - type: HereticAction
    requireMagicItem: true
  - type: SpeakOnAction
    sentence: heretic-speech-void-prison
  - type: ChangeUseDelayOnAscension
    newUseDelay: 15
    requiredPath: Void

- type: entity
  parent: BaseAction
  id: ActionHereticVoidPull
  name: Void Pull
  description: Calls the void, damaging, knocking down, pulling people closer, and stunning people nearby.
  components:
  - type: Action
    icon: { sprite: _Goobstation/Heretic/abilities_heretic.rsi, state: void_pull }
    useDelay: 30
    itemIconStyle: NoItem
    checkCanInteract: false
    sound: !type:SoundPathSpecifier
      path: /Audio/_Goobstation/Heretic/voidblink.ogg
  - type: InstantAction
    event: !type:HereticVoidPullEvent
  - type: HereticAction
    requireMagicItem: true
  - type: SpeakOnAction
    sentence: heretic-speech-void-pull
  - type: ChangeUseDelayOnAscension
    newUseDelay: 15
    requiredPath: Void

- type: entity
  parent: BaseAction
  id: ActionHereticVoidConduitAscension
  name: Void Conduit
  description: Opens a gate to the Void; it releases an intermittent pulse that damages windows and airlocks, while afflicting Heathens with void chill. Affected Heretics instead receive low pressure resistance.
  components:
  - type: Action
    icon: { sprite: _Goobstation/Heretic/abilities_heretic.rsi, state: void_rift }
    useDelay: 60
    itemIconStyle: NoItem
    checkCanInteract: false
  - type: InstantAction
    event: !type:HereticVoidConduitEvent
  - type: HereticAction
    requireMagicItem: true
  - type: SpeakOnAction
    sentence: heretic-speech-void-conduit

- type: entity
  parent: ActionHereticVoidConduitAscension
  id: ActionHereticVoidConduit
  description: Opens a gate to the Void; it releases an intermittent pulse that damages windows and airlocks, while afflicting Heathens with void chill. Affected Heretics instead receive low pressure resistance. Has 1 charge that can be replenished by breaking (using) your blade in hand.
  components:
  - type: HereticActionBladeBreakRecharge
  - type: LimitedCharges
    lastCharges: 1
    maxCharges: 1
  - type: ActionUpgrade
    effectedLevels:
      2: ActionHereticVoidConduitAscension
