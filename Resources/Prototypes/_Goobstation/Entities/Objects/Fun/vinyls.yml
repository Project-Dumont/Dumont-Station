- type: entity
  abstract: true
  id: BaseVinylDisk
  name: vinyl disk
  description: A vinyl disk containing music.
  parent: BaseItem
  components:
  - type: Vinyl
  - type: Sprite
    sprite: _Goobstation/Objects/Misc/RadioStation/vinyls.rsi
    state: default # Starlight - Rework radio host
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 12
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          VinylDiskBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnLand
    ignoreResistances: true
    damage:
      types:
        Blunt: 5
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 5
  # Starlight - Rework radio host - Start
  - type: Item
    size: Normal # Records take a 2x2 spot.
  # Starlight - Rework radio host - End
  - type: Tag
    tags:
    - VinylSleeveFit

- type: entity
  abstract: true
  id: BaseVinylSleeve
  name: vinyl sleeve
  description: A vinyl sleeve, perfect for storing your vinyls.
  parent: BaseItem
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Misc/RadioStation/vinylsleeves.rsi
  # Starlight - Rework radio host - Start
    layers:
    - state: sleeve-peek
      map: [ "enum.DiscCoverVisualLayers.Peek" ]
      visible: false
    - state: sleeve-base
      map: [ "enum.DiscCoverVisualLayers.Base" ]
      color: "#c8b78e"
    - state: sleeve-motif-0
      map: [ "enum.DiscCoverVisualLayers.Motif" ]
      visible: false
    - state: sleeve-shade
  - type: Appearance
  - type: DiscCover # Cover art comes from the record inside.
  - type: Item
    size: Normal # Records and their sleeves take a 2x2 spot.
  # Starlight - Rework radio host - End
  - type: ContainerContainer
    containers:
      vinyl: !type:ContainerSlot
        showEnts: false
        occludes: true
        ent: null
  - type: ItemSlots
    slots:
      vinyl:
        name: vinyl
        insertSound: /Audio/_Goobstation/RadioStation/vinyl/vinylEject.ogg
        ejectSound: /Audio/_Goobstation/RadioStation/vinyl/vinylInsert.ogg
        whitelist:
          tags:
          - VinylSleeveFit
  - type: Tag # Starlight
    tags:
    - VinylSleeve

