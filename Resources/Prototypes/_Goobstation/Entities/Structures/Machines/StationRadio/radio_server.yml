- type: entity
  id: StationRadioServer
  name: station radio server
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  description: A rack of servers, controls whether your voice is being broadcasted or not
  components:
  - type: Sprite
    sprite: _Goobstation/Structures/Machines/StationRadio/stationradioserver.rsi
    layers:
    - state: icon
  # Starlight - Radio host Rework - Start
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: panel
      visible: false
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    drawdepth: SmallObjects
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.WiresVisualLayers.MaintenancePanel:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: true }
          False: { visible: false }
  - type: WiresPanel
  - type: WiresVisuals
  - type: Wires
    layoutId: StationRadioServer
  - type: UserInterface
    interfaces:
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ApcPowerReceiver
  # Starlight - Radio host rework - End
  - type: StationRadioServer
  - type: DeviceLinkSource
    ports:
    - StationRadioServerPort
    # TODO: unlit & maints panel sprite
  - type: Transform
    noRot: false
  - type: Rotatable
  - type: Machine
    board: StationRadioServerCircuitboard
  - type: TelecomExempt

- type: entity
  id: StationRadioRig
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: station radio rig
  description: A collection of everything you need to play music over the station.
  components:
  - type: Sprite
    sprite: _Goobstation/Structures/Machines/StationRadio/radiostationrig.rsi
    layers:
    - state: icon
  # Starlight - Radio host rework - Start
    - state: record0
      visible: false
      map: [ "slot0" ]
    - state: record1
      visible: false
      map: [ "slot1" ]
    - state: record2
      visible: false
      map: [ "slot2" ]
    - state: record3
      visible: false
      map: [ "slot3" ]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: mic_on
      shader: unshaded
      visible: false
      map: ["micOn"]
    - state: mic_off
      shader: unshaded
      map: ["micOff"]
    drawdepth: SmallObjects
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.RadioDeviceVisuals.Broadcasting:
        micOn:
          True: { visible: true }
          False: { visible: false }
        micOff:
          True: { visible: false }
          False: { visible: true }
  - type: VinylPlayer
    slots: [ playlist1, playlist2, playlist3, playlist4 ]
    autoPlay: false
    loop: true
    channelName: station-radio-mixer-playlist
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      playlist1: !type:ContainerSlot
      playlist2: !type:ContainerSlot
      playlist3: !type:ContainerSlot
      playlist4: !type:ContainerSlot
  - type: ItemSlots
    slots:
      playlist1:
        priority: 4
        swap: false
        whitelist:
          tags:
          - VinylSleeveFit
      playlist2:
        priority: 3
        swap: false
        whitelist:
          tags:
          - VinylSleeveFit
      playlist3:
        priority: 2
        swap: false
        whitelist:
          tags:
          - VinylSleeveFit
      playlist4:
        priority: 1
        swap: false
        whitelist:
          tags:
          - VinylSleeveFit
  - type: RadioMicrophone
    powerRequired: true
    broadcastChannel: RadioShow
    unobstructedRequired: true
    toggleOnInteract: false
    toggleOnAltInteract: true
  # Starlight - Radio host rework - End
    # TODO: unlit & maints panel sprite
  - type: DeviceLinkSink
    ports:
    - StationRadioRigPort
  - type: Transform
    noRot: false
  - type: Rotatable
  - type: Machine
    board: StationRadioRigCircuitboard
  - type: RadioRig
