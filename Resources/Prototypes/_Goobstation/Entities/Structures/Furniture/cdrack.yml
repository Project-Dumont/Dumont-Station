- type: entity
  id: CdRack
  parent: BaseStructure
  name: CD rack
  description: Mostly filled with CDs.
  components:
  - type: Sprite
    sprite: _Goobstation/Structures/Furniture/cdrack.rsi
    snapCardinals: true
    layers:
      - state: base
      # Starlight - Rework radio host - Start
      - state: spine0
        map: [ "spine0" ]
        visible: false
      - state: spine1
        map: [ "spine1" ]
        visible: false
      - state: spine2
        map: [ "spine2" ]
        visible: false
      - state: spine3
        map: [ "spine3" ]
        visible: false
      - state: spine4
        map: [ "spine4" ]
        visible: false
      - state: spine5
        map: [ "spine5" ]
        visible: false
      - state: spine6
        map: [ "spine6" ]
        visible: false
      - state: spine7
        map: [ "spine7" ]
        visible: false
      - state: spine8
        map: [ "spine8" ]
        visible: false
      - state: spine9
        map: [ "spine9" ]
        visible: false
  - type: DiscSpines # Starlight - each spine in the colour of its CD case
    container: records
    count: 10
    bareColor: "#ccd6e3"
  - type: RecordCrate
    containerId: records
    capacity: 10
    fullLoc: cd-rack-full
    examineLoc: cd-rack-examine
    whitelist:
      tags:
        - CD
        - CDCase
  # Starlight - Rework radio host - End
  - type: Appearance
  - type: Damageable
    damageModifierSet: Wood
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: # Excess damage, don't spawn entities
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:EmptyAllContainersBehaviour # Starlight - Rework radio host
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 2
            max: 3
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Tag
    tags:
    - Structure
    - Wooden
  - type: Transform
    anchored: true
    noRot: true
  - type: Anchorable
  - type: InteractionOutline
  - type: ContainerContainer
    containers:
      records: !type:Container # Starlight - Rework radio host
  - type: Construction
    graph: CdRackGraph
    node: CdRackNode
