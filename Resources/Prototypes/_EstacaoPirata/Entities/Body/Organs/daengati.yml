- type: entity
  id: OrganDaengatiEyes
  parent: OrganHumanEyes
  name: daengati eyes
  description: "Eyes similar to those of a feline, with vertical pupils."
  components:
  - type: Sprite
    sprite: _Gabystation/Mobs/Species/Daengati/organs.rsi
    layers:
      - state: eyeball-l
      - state: eyeball-r
  - type: Organ
    onAdd:
    - type: EyeProtection # Dumont | Para compensar a perda de visão noturna, esses olhos são agora robustos pra aguentar solda.

- type: entity
  id: OrganDaengatiStomach
  parent: OrganAnimalStomach
  categories: [ HideSpawnMenu ]
  components:
  - type: Stomach
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
