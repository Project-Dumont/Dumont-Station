- type: entity
  parent: BaseMobHuman
  name: Urist McDemon
  id: MobDaengatiBase
  abstract: true
  components:
  - type: HumanoidAppearance
    species: Daengati
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 3.5
        Heat: 2
  - type: Body
    prototype: Daengati
  - type: Daengati
    modifiers:
      coefficients:
        Heat: 0.6
        Cold: 1.3
        Piercing: 1.15
  - type: Damageable
    damageModifierSet: Daengati

- type: entity
  save: false
  name: Urist McDemon
  parent: MobHumanDummy
  id: MobDaengatiDummy
  description: A dummy Daengati meant to be used in character setup.
  categories: [ HideSpawnMenu ]
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female

