      pos: -0.6824486,5.519004
    - type: Paper
      stampState: paper_stamp-syndicate
      stampedBy:
      - stampLargeIcon: null
        stampFont: null
        stampedName: stamp-component-stamped-name-syndicate
        stampedColor: '#850000FF'
        hasIcon: True
      content: >+
        Seu fax normal é invisível para os faxes da estação, a menos que eles sejam emaggados, mas às vezes seu trabalho envolve receber mensagens.


        Este fax pode ser acessado por fax vinculados à estação; por padrão, é chamado de "Desconhecido".


        Você pode renomeá-lo para o que quiser, por exemplo: "CentComm" usando uma chave de fenda (ou sua caneta Cybersun™)



  - uid: 1147
