      stampedBy:
      - stampLargeIcon: null
        stampFont: null
        stampedName: stamp-component-stamped-name-syndicate
        stampedColor: '#850000FF'
        hasIcon: True
      content: >+
        Você pode usar este holopad de longo alcance para fazer chamadas.


        Use o equipamento Camaleão fornecido para fingir ser quem você está tentando personificar.


        Holo chamadas fornecem o nome do ligador e usam o ID do agente para fornecer um.


        As Holocalls também dizem de onde são feitas, use o Rotulador para alterar o seu, o formato é (Departamento - Localização)



